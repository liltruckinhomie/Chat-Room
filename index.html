<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Homie Chat – Video & Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== AUTH ===== */
        .auth-container {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 18px 14px;
            width: 320px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .auth-btn {
            width:100%; padding:9px; margin:4px 0;
            background: linear-gradient(145deg,#1877f2,#1658d4);
            color:white; border:none; border-radius:6px;
            font-size:13px; font-weight:600; cursor:pointer;
        }
        .auth-btn:hover { opacity:0.9; }
        .form-input {
            width:100%; padding:8px; margin:5px 0;
            background:rgba(255,255,255,0.85);
            border:1px solid rgba(0,0,0,0.12);
            border-radius:5px; font-size:13px; outline:none;
        }
        .form-input:focus { border-color:#1877f2; }
        .error-msg { color:#ff4242; font-size:11px; min-height:14px; margin:2px 0; }
        .hidden { display:none !important; }
        .back-btn {
            position:absolute; top:10px; right:12px;
            background:none; border:none; color:#1877f2;
            font-size:18px; cursor:pointer; line-height:1;
        }
        .form-title { font-size:15px; margin:4px 0 12px; text-align:center; font-weight:600; color:#222; }
        .main-buttons { margin-top:8px; }

        .user-info { display:flex; align-items:center; gap:10px; margin:8px 0 14px; }
        .profile-picture {
            width:48px; height:48px; border-radius:50%;
            object-fit:cover; border:2px solid #1877f2; flex-shrink:0;
        }
        .welcome-text { font-size:18px; font-weight:600; color:#222; }
        .welcome-name { color:#1877f2; }
        .join-btn {
            width:100%; padding:10px; margin:4px 0;
            background: linear-gradient(145deg,#4285F4,#1a73e8);
            color:white; border:none; border-radius:6px;
            font-size:15px; font-weight:600; cursor:pointer;
        }
        .join-btn:hover { opacity:0.92; }
        .signout-btn {
            position:absolute; top:8px; right:8px;
            padding:5px 10px;
            background:rgba(255,0,0,0.08); color:#e03;
            border:1px solid rgba(255,0,0,0.18);
            border-radius:6px; font-size:11px; font-weight:600; cursor:pointer;
        }

        .join-online-pill {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25);
            color: #4ade80; padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600; margin-bottom: 10px;
        }
        .join-online-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #4ade80; animation: pulse 1.5s infinite;
        }

        .ban-box {
            background:rgba(255,0,0,0.08); border:1px solid rgba(255,0,0,0.25);
            border-radius:8px; padding:10px 12px; margin:8px 0;
            text-align:center; font-size:13px;
        }
        .ban-box .ban-name { font-weight:700; color:#c00; font-size:14px; margin-bottom:4px; }
        .ban-box .ban-detail { color:#555; font-size:12px; margin:2px 0; }

        /* ===== APP ===== */
        #app {
            display:none; width:100%; height:100%;
            flex-direction:column; background:#1a1a2e;
            position:fixed; top:0; left:0; right:0; bottom:0;
        }
        .topbar {
            background:#16213e; color:white;
            padding:10px 16px;
            display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid #2c3e66; flex-shrink:0;
        }
        .online-pill {
            background:#2c3e66; padding:4px 12px;
            border-radius:20px; font-size:12px;
        }
        .online-dot {
            display:inline-block; width:8px; height:8px;
            background:#4ade80; border-radius:50%;
            margin-right:5px; animation:pulse 1.5s infinite;
        }
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .top-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid #1877f2; }
        .top-name { color:white; font-size:13px; font-weight:600; }

        .topbar-right {
            display:flex; align-items:center; gap:10px;
        }
        .fullscreen-btn {
            background:rgba(255,255,255,0.08); border:none;
            width:32px; height:32px; border-radius:7px;
            color:#ccc; cursor:pointer; font-size:15px;
            display:flex; align-items:center; justify-content:center;
            transition:background 0.15s;
        }
        .fullscreen-btn:hover { background:rgba(255,255,255,0.16); }

        .app-body { display:flex; flex:1; overflow:hidden; min-height:0; }

        .video-grid {
            flex: 1;
            display: grid;
            gap: 6px;
            padding: 6px;
            background: #0a0a14;
            overflow: hidden;
            min-height: 0;
            min-width: 0;
            align-content: center;
            justify-content: center;
        }

        .vtile {
            position: relative;
            background: #1c1c2e;
            border-radius: 12px;
            overflow: hidden;
            min-height: 0;
            min-width: 0;
            border: 2px solid rgba(255,255,255,0.15);
        }

        .vtile.spotlight {
            border: 2px solid rgba(255,255,255,0.3);
        }

        .vtile.screensharing {
            border: 2px solid rgba(124,58,237,0.7);
            box-shadow: 0 0 16px rgba(124,58,237,0.3);
        }

        .vtile video {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            background: #0a0a14;
        }

        .vtile .av-overlay {
            position:absolute; inset:0;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background:#1c1c2e; gap:10px;
        }
        .vtile .av-overlay img {
            width:80px; height:80px; border-radius:50%;
            border:3px solid #1877f2; object-fit:cover;
        }
        .vtile .av-overlay span { color:#ccc; font-size:13px; font-weight:500; }

        .vtile.spotlight .av-overlay img { width:110px; height:110px; }
        .vtile.spotlight .av-overlay span { font-size:15px; }

        .vtile .name-label {
            position:absolute; bottom:8px; left:8px;
            background:rgba(0,0,0,0.7); padding:4px 10px;
            border-radius:20px; font-size:11px; color:white;
            display:flex; align-items:center; gap:5px; z-index:3;
            backdrop-filter: blur(4px);
        }
        .vtile .name-label img { width:18px; height:18px; border-radius:50%; }
        .vtile .mute-icon {
            position:absolute; top:8px; right:8px;
            background:rgba(220,38,38,0.85); width:26px; height:26px;
            border-radius:50%; display:none;
            align-items:center; justify-content:center;
            font-size:13px; z-index:3;
        }
        .vtile .mute-icon.show { display:flex; }

        .screen-badge {
            position:absolute; top:8px; left:8px;
            background:rgba(124,58,237,0.85); padding:3px 8px;
            border-radius:20px; font-size:10px; color:white;
            font-weight:700; letter-spacing:0.05em;
            display:none; align-items:center; gap:4px; z-index:3;
            backdrop-filter: blur(4px);
        }
        .screen-badge.show { display:flex; }

        .sidebar {
            width:300px; background:rgba(255,255,255,0.03);
            border-left:1px solid rgba(255,255,255,0.07);
            display:flex; flex-direction:column; flex-shrink:0;
        }
        .tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.07); }
        .tab { flex:1; padding:11px; text-align:center; color:#777; cursor:pointer; font-size:13px; }
        .tab.active { color:#60a5fa; border-bottom:2px solid #60a5fa; }
        .panel { display:none; flex:1; overflow:hidden; flex-direction:column; min-height:0; }
        .panel.active { display:flex; }
        .chat-msgs {
            flex:1; overflow-y:auto; padding:10px;
            display:flex; flex-direction:column; gap:6px;
        }
        .msg { display:flex; flex-direction:column; gap:3px; }
        .msg-head { display:flex; align-items:baseline; gap:7px; }
        .msg-name { font-size:11px; font-weight:600; color:#60a5fa; }
        .msg-name.me { color:#a78bfa; }
        .msg-time { font-size:10px; color:#444; }
        .msg-body {
            font-size:13px; color:#ddd;
            background:rgba(255,255,255,0.05);
            padding:7px 11px; border-radius:10px; word-break:break-word;
        }
        .msg.me .msg-body { background:rgba(96,165,250,0.15); }
        .msg.sys .msg-body { background:none; color:#555; font-style:italic; padding:3px 0; }
        .chat-input {
            padding:9px; border-top:1px solid rgba(255,255,255,0.07);
            display:flex; gap:7px;
        }
        .chat-input input {
            flex:1; padding:9px 12px;
            background:rgba(255,255,255,0.07);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:20px; color:white; font-size:13px; outline:none;
        }
        .chat-input button {
            width:34px; height:34px; background:#1877f2;
            border:none; border-radius:50%; color:white; cursor:pointer; font-size:16px;
        }
        .people-list { flex:1; overflow-y:auto; padding:9px; }
        .person {
            display:flex; align-items:center; gap:9px; padding:9px;
            background:rgba(255,255,255,0.05); border-radius:9px; margin-bottom:5px;
        }
        .person img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
        .person-name { flex:1; font-size:13px; color:#ddd; }

        /* ===== CONTROLS ===== */
        .controls {
            padding: 10px 20px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background:#16213e;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:16px;
            border-top:1px solid #2c3e66;
            flex-shrink:0;
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
        }
        .toggle-group {
            display:flex; flex-direction:column;
            align-items:center; gap:4px;
        }
        .toggle-label {
            font-size:10px; color:#888;
            font-weight:600; letter-spacing:0.05em; text-transform:uppercase;
        }
        .toggle-pill {
            width:82px; height:36px; border-radius:18px;
            border:none; cursor:pointer;
            font-size:12px; font-weight:700; letter-spacing:0.04em;
            transition:background 0.2s, box-shadow 0.2s;
            display:flex; align-items:center; justify-content:center; gap:5px;
            white-space:nowrap;
        }
        .toggle-pill.state-on {
            background:#1877f2; color:white;
            box-shadow:0 0 12px rgba(24,119,242,0.5);
        }
        .toggle-pill.state-off {
            background:rgba(255,255,255,0.08); color:#888; box-shadow:none;
        }
        .toggle-pill.state-screen {
            background: linear-gradient(135deg,#7c3aed,#4f46e5);
            color: white;
            box-shadow: 0 0 14px rgba(124,58,237,0.55);
        }
        .toggle-pill .pill-dot {
            width:8px; height:8px; border-radius:50%; transition:background 0.2s;
        }
        .toggle-pill.state-on .pill-dot { background:#7dd3fc; }
        .toggle-pill.state-off .pill-dot { background:#555; }
        .toggle-pill.state-screen .pill-dot { background:#c4b5fd; }
        .end-btn {
            width:48px; height:48px; border-radius:50%; border:none;
            background:#dc2626; color:white; font-size:20px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
        }
        .end-btn:hover { background:#b91c1c; }

        .toast {
            position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
            background:#222; color:white; padding:7px 16px;
            border-radius:30px; font-size:13px; opacity:0;
            transition:opacity .2s; pointer-events:none; z-index:9999;
        }
        .toast.show { opacity:1; }

        .mobile-drawer-btn { display:none; }
        .mobile-drawer-overlay { display:none; }
        .mobile-drawer { display:none; }

        @media (max-width: 700px) {
            .sidebar { display:none !important; }
            .mobile-drawer-btn {
                display:flex; flex-direction:column;
                align-items:center; gap:4px;
            }
            .controls {
                padding: 8px 12px;
                padding-bottom: max(14px, env(safe-area-inset-bottom));
                gap:10px;
            }
            .toggle-pill { width:72px; height:34px; font-size:11px; }
            .end-btn { width:46px; height:46px; font-size:18px; }
            .mobile-drawer-overlay {
                display:block;
                position:fixed; inset:0;
                background:rgba(0,0,0,0.55);
                z-index:200;
                opacity:0; pointer-events:none;
                transition:opacity 0.22s;
            }
            .mobile-drawer-overlay.open { opacity:1; pointer-events:all; }
            .mobile-drawer {
                display:flex; flex-direction:column;
                position:fixed; bottom:0; left:0; right:0;
                height:72vh;
                background:#16213e;
                border-radius:18px 18px 0 0;
                border-top:1px solid #2c3e66;
                z-index:201;
                transform:translateY(100%);
                transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
                padding-bottom: env(safe-area-inset-bottom);
            }
            .mobile-drawer.open { transform:translateY(0); }
            .drawer-handle {
                width:38px; height:4px; background:#444;
                border-radius:2px; margin:10px auto 0; flex-shrink:0;
            }
            .drawer-close {
                position:absolute; top:10px; right:14px;
                background:none; border:none; color:#888;
                font-size:20px; cursor:pointer;
            }
            .drawer-tabs {
                display:flex; border-bottom:1px solid rgba(255,255,255,0.07);
                flex-shrink:0; margin-top:6px;
            }
            .drawer-tab {
                flex:1; padding:11px; text-align:center;
                color:#777; cursor:pointer; font-size:13px;
            }
            .drawer-tab.active { color:#60a5fa; border-bottom:2px solid #60a5fa; }
            .drawer-panel { display:none; flex:1; overflow:hidden; flex-direction:column; min-height:0; }
            .drawer-panel.active { display:flex; }
            .top-name { display:none; }
            .topbar { padding:8px 12px; }
        }
    </style>
</head>
<body>

<div id="authWrap">
    <div class="auth-container" id="authMain">
        <div id="banBox" class="ban-box hidden">
            <div class="ban-name" id="banName"></div>
            <div class="ban-detail" id="banReasonLine"></div>
            <div class="ban-detail" id="banUntilLine"></div>
        </div>
        <div id="authBtns" class="main-buttons">
            <button id="showSignup" class="auth-btn">Sign Up</button>
            <button id="showLogin"  class="auth-btn">Sign In</button>
        </div>
        <div id="userDisplay" class="hidden">
            <div class="user-info">
                <img id="profilePic" class="profile-picture"
                     src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png">
                <div>
                    <div class="welcome-text">Welcome, <span class="welcome-name" id="displayName"></span>!</div>
                </div>
            </div>
            <div class="join-online-pill" id="joinOnlinePill" style="display:none">
                <span class="join-online-dot"></span>
                <span id="joinOnlineCount">0</span> in call
            </div>
            <button class="join-btn" id="joinBtn">🎥 Join Call</button>
            <button id="signoutBtn" class="signout-btn">Sign Out</button>
        </div>
    </div>
    <div class="auth-container hidden" id="signupPanel">
        <button class="back-btn" id="backFromSignup">×</button>
        <h3 class="form-title">Create Account</h3>
        <input type="text"     id="signupUser" class="form-input" placeholder="Username">
        <input type="password" id="signupPass" class="form-input" placeholder="Password (6+ chars)">
        <div class="error-msg" id="signupErr"></div>
        <button id="doSignup" class="auth-btn">Sign Up</button>
    </div>
    <div class="auth-container hidden" id="loginPanel">
        <button class="back-btn" id="backFromLogin">×</button>
        <h3 class="form-title">Sign In</h3>
        <input type="text"     id="loginUser" class="form-input" placeholder="Username">
        <input type="password" id="loginPass" class="form-input" placeholder="Password">
        <div class="error-msg" id="loginErr"></div>
        <button id="doLogin" class="auth-btn">Sign In</button>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div class="online-pill"><span class="online-dot"></span><span id="onlineCount">1</span> online</div>
        <div class="topbar-right">
            <img id="topAvatar" class="top-avatar" src="">
            <span id="topName" class="top-name"></span>
            <button class="fullscreen-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
        </div>
    </div>
    <div class="app-body">
        <div class="video-grid" id="videoGrid"></div>
        <div class="sidebar">
            <div class="tabs">
                <div class="tab active" data-tab="chat">💬 Chat</div>
                <div class="tab"        data-tab="people">👥 People</div>
            </div>
            <div class="panel active" id="chatPanel">
                <div class="chat-msgs" id="chatMsgs"></div>
                <div class="chat-input">
                    <input id="chatIn" type="text" placeholder="Message...">
                    <button id="sendBtn">↑</button>
                </div>
            </div>
            <div class="panel" id="peoplePanel">
                <div class="people-list" id="peopleList"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="toggle-group">
            <span class="toggle-label">Microphone</span>
            <button class="toggle-pill state-on" id="micBtn">
                <span class="pill-dot"></span>
                <span class="pill-text">ON</span>
            </button>
        </div>
        <div class="toggle-group">
            <span class="toggle-label">Camera</span>
            <button class="toggle-pill state-off" id="camBtn">
                <span class="pill-dot"></span>
                <span class="pill-text">OFF</span>
            </button>
        </div>
        <div class="toggle-group">
            <span class="toggle-label">Screen</span>
            <button class="toggle-pill state-off" id="screenBtn">
                <span class="pill-dot"></span>
                <span class="pill-text">Share</span>
            </button>
        </div>
        <button class="end-btn" id="endBtn" title="Leave">✕</button>
        <div class="toggle-group mobile-drawer-btn">
            <span class="toggle-label">Chat/Users</span>
            <button class="toggle-pill state-off" id="drawerToggleBtn" style="width:90px;">
                <span style="font-size:15px;">💬</span>
                <span>Open</span>
            </button>
        </div>
    </div>
</div>

<div class="mobile-drawer-overlay" id="drawerOverlay"></div>
<div class="mobile-drawer" id="mobileDrawer">
    <div class="drawer-handle"></div>
    <button class="drawer-close" id="drawerClose">×</button>
    <div class="drawer-tabs">
        <div class="drawer-tab active" data-dtab="chat">💬 Chat</div>
        <div class="drawer-tab"        data-dtab="people">👥 People</div>
    </div>
    <div class="drawer-panel active" id="drawerChatPanel">
        <div class="chat-msgs" id="drawerChatMsgs"></div>
        <div class="chat-input">
            <input id="drawerChatIn" type="text" placeholder="Message...">
            <button id="drawerSendBtn">↑</button>
        </div>
    </div>
    <div class="drawer-panel" id="drawerPeoplePanel">
        <div class="people-list" id="drawerPeopleList"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

function parseBan(f){
    if(!f) return null;
    try{
        if(f.toLowerCase().includes('forever')) return {reason:f.split('/')[0],forever:true};
        const p=f.split('/');
        if(p.length===5){
            const fy=parseInt(p[4])<100?2000+parseInt(p[4]):parseInt(p[4]);
            return{reason:p[0],time:p[1],until:new Date(fy,parseInt(p[3])-1,parseInt(p[2]),parseInt(p[1].substring(0,2)),parseInt(p[1].substring(2,4))),forever:false};
        }
        if(p.length===4){
            const fy=parseInt(p[3])<100?2000+parseInt(p[3]):parseInt(p[3]);
            return{reason:p[0],until:new Date(fy,parseInt(p[2])-1,parseInt(p[1])),forever:false};
        }
    }catch(e){}
    return null;
}
function isBanned(f){ const b=parseBan(f); return b&&(b.forever||new Date()<b.until); }
function isBanExpired(f){ const b=parseBan(f); return b&&!b.forever&&new Date()>=b.until; }
function showBanUI(username,b){
    qs('banName').textContent=b.forever?`${username} is permanently banned`:`${username} has been banned`;
    qs('banReasonLine').textContent='Reason: '+b.reason;
    if(!b.forever&&b.until){
        const ds=b.until.toLocaleDateString('en-GB');
        const ts=b.time?` ${b.time.substring(0,2)}:${b.time.substring(2,4)}`:'';
        qs('banUntilLine').textContent='Until: '+ds+ts;
        qs('banUntilLine').classList.remove('hidden');
    }else{ qs('banUntilLine').classList.add('hidden'); }
    qs('banBox').classList.remove('hidden');
    lastBannedUser=username;
    qs('signupPanel').classList.add('hidden');
    qs('loginPanel').classList.add('hidden');
    qs('authMain').style.display='block';
    qs('authBtns').classList.remove('hidden');
    qs('userDisplay').classList.add('hidden');
}
function hideBanUI(){ qs('banBox').classList.add('hidden'); lastBannedUser=null; }
async function checkAndHandleBan(uid,username){
    const doc=await db.collection('users').doc(uid).get();
    if(!doc.exists) return false;
    const d=doc.data();
    if(d.banned&&isBanExpired(d.banned)){ await db.collection('users').doc(uid).update({banned:firebase.firestore.FieldValue.delete()}); hideBanUI(); return false; }
    if(d.banned&&isBanned(d.banned)){ showBanUI(username,parseBan(d.banned)); await auth.signOut(); return true; }
    hideBanUI(); return false;
}
function startBanListener(uid,username){
    if(unsubBan) unsubBan();
    unsubBan=db.collection('users').doc(uid).onSnapshot(async doc=>{
        if(!doc.exists) return;
        const d=doc.data();
        if(d.banned&&isBanExpired(d.banned)){ await db.collection('users').doc(uid).update({banned:firebase.firestore.FieldValue.delete()}); hideBanUI(); return; }
        if(d.banned&&isBanned(d.banned)){ showBanUI(username,parseBan(d.banned)); await auth.signOut(); }
        else hideBanUI();
    });
}

async function initMedia(){
    hasVideoPermission=false;
    try{
        localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});
        hasVideoPermission=true; micOn=true; camOn=false;
        localStream.getVideoTracks().forEach(t=>{ t.enabled=false; });
        toast('Mic ON · Camera OFF — click Camera to enable');
    }catch(e){
        try{
            localStream=await navigator.mediaDevices.getUserMedia({audio:true});
            hasVideoPermission=false; micOn=true; camOn=false;
            toast('Audio only (camera unavailable)');
        }catch(e2){
            localStream=new MediaStream(); hasVideoPermission=false; micOn=false; camOn=false;
            toast('No media access — check browser permissions');
        }
    }
    updateCtrlBtns();
    tryBecomeHost();
}

function startHeartbeat(){
    stopHeartbeat();
    if(isHost){
        heartbeatSendTimer=setInterval(()=>{
            const now=Date.now();
            Object.values(connections).forEach(c=>{ if(c.conn&&c.conn.open) try{ c.conn.send({type:'ping',ts:now}); }catch(e){} });
            Object.entries(connections).forEach(([gid,c])=>{ if(c.lastPing&&now-c.lastPing>HEARTBEAT_TIMEOUT){ console.warn('Guest timed out:',gid); removeGuest(gid); } });
        }, HEARTBEAT_INTERVAL);
    }else{
        hostLastPing=Date.now();
        heartbeatCheckTimer=setInterval(()=>{
            if(Date.now()-hostLastPing>HEARTBEAT_TIMEOUT){ console.warn('Host timed out'); stopHeartbeat(); scheduleTakeover(); }
        }, HEARTBEAT_INTERVAL);
    }
}
function stopHeartbeat(){ clearInterval(heartbeatSendTimer); clearInterval(heartbeatCheckTimer); heartbeatSendTimer=null; heartbeatCheckTimer=null; }
function scheduleTakeover(){
    if(takeoverTimer) return;
    const delay=randomTakeoverDelay();
    takeoverTimer=setTimeout(()=>{ takeoverTimer=null; if(qs('app').style.display!=='none') tryBecomeHost(); }, delay);
}
function cancelTakeover(){ if(takeoverTimer){ clearTimeout(takeoverTimer); takeoverTimer=null; } }

function tryBecomeHost(){
    cancelTakeover(); stopHeartbeat();
    if(peer){ try{ peer.destroy(); }catch(e){} peer=null; }
    peer=new Peer(HOST_ID,PEER_CFG);
    peer.on('open',()=>{
        isHost=true; myPeerId=HOST_ID;
        participants={}; participants[myPeerId]={name:myName,pic:myPicUrl,stream:localStream,muted:!micOn,hasVideo:false,isScreenSharing:false};
        renderAll();
        peer.on('connection',onGuestConn);
        peer.on('call',onGuestCall);
        startHeartbeat();
    });
    peer.on('error',err=>{ if(err.type==='unavailable-id'){ peer.destroy(); peer=null; joinAsGuest(); } else console.error('host peer err',err); });
}

function joinAsGuest(){
    cancelTakeover(); stopHeartbeat();
    if(peer){ try{ peer.destroy(); }catch(e){} peer=null; }
    const gid='g-'+Date.now()+'-'+Math.random().toString(36).substr(2,5);
    peer=new Peer(gid,PEER_CFG);
    peer.on('open',id=>{
        isHost=false; myPeerId=id;
        participants={}; participants[myPeerId]={name:myName,pic:myPicUrl,stream:localStream,muted:!micOn,hasVideo:false,isScreenSharing:false};
        connections={}; hostConn=null; renderAll();
        hostConn=peer.connect(HOST_ID,{metadata:{name:myName,pic:myPicUrl,id:myPeerId}});
        hostConn.on('open',()=>{
            cancelTakeover(); startHeartbeat();
            const call=peer.call(HOST_ID,localStream,{metadata:{name:myName,pic:myPicUrl,id:myPeerId}});
            call.on('stream',remoteStream=>{
                ensureAudioPlaying(remoteStream,HOST_ID);
                const existingHasVideo=participants[HOST_ID]?.hasVideo||false;
                const existingIsScreen=participants[HOST_ID]?.isScreenSharing||false;
                upsertParticipant(HOST_ID,participants[HOST_ID]?.name||'Host',participants[HOST_ID]?.pic||PICS[0],remoteStream,false,existingHasVideo,existingIsScreen);
            });
            call.on('error',e=>console.error('call-to-host err',e));
        });
        hostConn.on('data',handleDataFromHost);
        hostConn.on('close',()=>{ stopHeartbeat(); scheduleTakeover(); });
        hostConn.on('error',e=>console.error('hostConn err',e));
        peer.on('call',incomingCall=>{
            const meta=incomingCall.metadata||{};
            if(!meta.relay){ incomingCall.close(); return; }
            incomingCall.answer(localStream);
            incomingCall.on('stream',remoteStream=>{
                ensureAudioPlaying(remoteStream,meta.sourceId);
                const existingHasVideo=participants[meta.sourceId]?.hasVideo||false;
                const existingIsScreen=participants[meta.sourceId]?.isScreenSharing||false;
                upsertParticipant(meta.sourceId,meta.sourceName,meta.sourcePic,remoteStream,false,existingHasVideo,existingIsScreen);
            });
            incomingCall.on('close',()=>{ delete participants[meta.sourceId]; renderAll(); });
            incomingCall.on('error',e=>console.error('relay-in err',e));
        });
    });
    peer.on('error',err=>{ console.error('guest peer err',err.type); if(err.type==='peer-unavailable') setTimeout(tryBecomeHost,randomTakeoverDelay()); });
    peer.on('disconnected',()=>{ try{ peer.reconnect(); }catch(e){} });
}

const audioElements={};
function ensureAudioPlaying(stream,peerId){
    if(!stream||!peerId||peerId===myPeerId) return;
    if(!audioElements[peerId]){ const aud=document.createElement('audio'); aud.autoplay=true; aud.style.display='none'; document.body.appendChild(aud); audioElements[peerId]=aud; }
    const aud=audioElements[peerId];
    if(aud.srcObject!==stream){ aud.srcObject=stream; aud.play().catch(e=>console.warn('audio play blocked:',e)); }
}
function cleanupAudioElement(peerId){ if(audioElements[peerId]){ audioElements[peerId].srcObject=null; audioElements[peerId].remove(); delete audioElements[peerId]; } }

function onGuestConn(conn){
    const gid=conn.peer,meta=conn.metadata||{};
    if(!connections[gid]) connections[gid]={};
    connections[gid].conn=conn; connections[gid].name=meta.name||'Guest'; connections[gid].pic=meta.pic||PICS[0]; connections[gid].lastPing=Date.now();
    upsertParticipant(gid,meta.name,meta.pic,null,false,false,false);
    conn.on('open',()=>{
        const list=Object.entries(participants).map(([id,p])=>({id,name:p.name,pic:p.pic,muted:p.muted,hasVideo:p.hasVideo,isScreenSharing:p.isScreenSharing||false}));
        conn.send({type:'init',participants:list});
        broadcastExcept({type:'joined',participant:{id:gid,name:meta.name,pic:meta.pic}},gid);
        addSysMsg(`${meta.name} joined`);
    });
    conn.on('data',d=>handleDataFromGuest(gid,d));
    conn.on('close',()=>removeGuest(gid));
    conn.on('error',e=>console.error('guest conn err',e));
}

function onGuestCall(call){
    const gid=call.peer,meta=call.metadata||{};
    if(!connections[gid]) connections[gid]={};
    connections[gid].call=call;
    call.answer(localStream);
    call.on('stream',guestStream=>{
        const name=meta.name||connections[gid]?.name||'Guest';
        const pic=meta.pic||connections[gid]?.pic||PICS[0];
        const hasVid=participants[gid]?.hasVideo||false;
        const isScreen=participants[gid]?.isScreenSharing||false;
        connections[gid].stream=guestStream; connections[gid].name=name; connections[gid].pic=pic;
        ensureAudioPlaying(guestStream,gid);
        upsertParticipant(gid,name,pic,guestStream,false,hasVid,isScreen);
        Object.entries(connections).forEach(([otherId,other])=>{ if(otherId===gid||!other.conn||!other.conn.open) return; relayTo(otherId,gid,name,pic,guestStream); });
        Object.entries(connections).forEach(([otherId,other])=>{ if(otherId===gid||!other.stream) return; relayTo(gid,otherId,other.name,other.pic,other.stream); });
    });
    call.on('close',()=>{ if(participants[gid]){ participants[gid].stream=null; participants[gid].hasVideo=false; participants[gid].isScreenSharing=false; } renderAll(); });
    call.on('error',e=>console.error('guest call err',e));
}

function relayTo(targetId,sourceId,sourceName,sourcePic,sourceStream){
    if(!connections[targetId]?.conn?.open) return;
    const rc=peer.call(targetId,sourceStream,{metadata:{relay:true,sourceId,sourceName,sourcePic}});
    if(!connections[sourceId]) connections[sourceId]={};
    if(!connections[sourceId].relays) connections[sourceId].relays={};
    connections[sourceId].relays[targetId]=rc;
    rc.on('error',e=>console.error('relay err',e));
}

function handleDataFromGuest(sid,d){
    switch(d.type){
        case 'ping': if(connections[sid]?.conn?.open) try{ connections[sid].conn.send({type:'pong',ts:d.ts}); }catch(e){} break;
        case 'pong': if(connections[sid]) connections[sid].lastPing=Date.now(); break;
        case 'mute-status': if(participants[sid]) participants[sid].muted=d.muted; renderAll(); broadcastExcept({type:'mute-status',id:sid,muted:d.muted},sid); break;
        case 'cam-status': if(participants[sid]) participants[sid].hasVideo=d.hasVideo; renderAll(); broadcastExcept({type:'cam-status',id:sid,hasVideo:d.hasVideo},sid); break;
        case 'screen-status': if(participants[sid]) participants[sid].isScreenSharing=d.isScreenSharing; renderAll(); broadcastExcept({type:'screen-status',id:sid,isScreenSharing:d.isScreenSharing},sid); break;
        case 'chat': broadcastAll({type:'chat',name:d.name,text:d.text,time:d.time}); addMsg(d.name,d.text,d.time,false); break;
    }
}

function handleDataFromHost(d){
    switch(d.type){
        case 'ping': hostLastPing=Date.now(); if(hostConn&&hostConn.open) try{ hostConn.send({type:'pong',ts:d.ts}); }catch(e){} break;
        case 'pong': hostLastPing=Date.now(); break;
        case 'init': d.participants.forEach(p=>{ if(p.id!==myPeerId) upsertParticipant(p.id,p.name,p.pic,null,p.muted,p.hasVideo,p.isScreenSharing||false); }); break;
        case 'joined': if(d.participant.id!==myPeerId){ upsertParticipant(d.participant.id,d.participant.name,d.participant.pic,null,false,false,false); addSysMsg(`${d.participant.name} joined`); } break;
        case 'left': if(d.id!==myPeerId){ delete participants[d.id]; cleanupAudioElement(d.id); renderAll(); addSysMsg(`${d.name} left`); } break;
        case 'mute-status': if(participants[d.id]) participants[d.id].muted=d.muted; renderAll(); break;
        case 'cam-status': if(participants[d.id]) participants[d.id].hasVideo=d.hasVideo; renderAll(); break;
        case 'screen-status': if(participants[d.id]) participants[d.id].isScreenSharing=d.isScreenSharing; renderAll(); break;
        case 'chat': if(d.name!==myName) addMsg(d.name,d.text,d.time,false); break;
    }
}

function broadcastAll(data){ Object.values(connections).forEach(c=>{ if(c.conn&&c.conn.open) try{ c.conn.send(data); }catch(e){} }); }
function broadcastExcept(data,skip){ Object.entries(connections).forEach(([id,c])=>{ if(id===skip) return; if(c.conn&&c.conn.open) try{ c.conn.send(data); }catch(e){} }); }

function removeGuest(gid){
    const name=participants[gid]?.name||'Someone';
    if(connections[gid]?.relays) Object.values(connections[gid].relays).forEach(r=>{ try{ r.close(); }catch(e){} });
    cleanupAudioElement(gid);
    delete participants[gid]; delete connections[gid];
    renderAll(); broadcastAll({type:'left',id:gid,name}); addSysMsg(`${name} left`);
}

function upsertParticipant(id,name,pic,stream,muted,hasVideo,isScreenSharing){
    if(!participants[id]) participants[id]={name,pic,stream,muted,hasVideo,isScreenSharing:isScreenSharing||false};
    else{
        if(name) participants[id].name=name;
        if(pic) participants[id].pic=pic;
        if(stream!==null) participants[id].stream=stream;
        participants[id].muted=muted; participants[id].hasVideo=hasVideo;
        if(isScreenSharing!==undefined) participants[id].isScreenSharing=isScreenSharing;
    }
    if(id!==myPeerId&&participants[id].stream) ensureAudioPlaying(participants[id].stream,id);
    renderAll();
}

// ===== SCREEN SHARE =====
async function toggleScreen(){
    if(!screenOn){
        // Start screen sharing
        if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){
            toast('Screen sharing not supported in this browser');
            return;
        }
        try{
            screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
            screenOn=true;
            const screenTrack=screenStream.getVideoTracks()[0];

            // Replace video track in localStream so peers receive it
            if(localStream){
                const oldVid=localStream.getVideoTracks()[0];
                if(oldVid) localStream.removeTrack(oldVid);
                localStream.addTrack(screenTrack);
            }

            // Replace track in all active peer connections
            if(peer){
                Object.values(peer.connections).forEach(conns=>{
                    conns.forEach(conn=>{
                        if(conn.type==='media'&&conn.peerConnection){
                            const senders=conn.peerConnection.getSenders();
                            const vidSender=senders.find(s=>s.track&&s.track.kind==='video');
                            if(vidSender) vidSender.replaceTrack(screenTrack).catch(e=>console.warn('replaceTrack err:',e));
                        }
                    });
                });
            }

            // Auto-stop when user hits browser's built-in stop button
            screenTrack.onended=()=>{ if(screenOn) stopScreenShare(); };

            // Notify others of screen share status
            if(participants[myPeerId]) participants[myPeerId].isScreenSharing=true;
            renderAll();
            const pkt={type:'screen-status',isScreenSharing:true};
            if(isHost) broadcastAll({...pkt,id:HOST_ID}); else if(hostConn&&hostConn.open) hostConn.send(pkt);

            // Also signal hasVideo so the tile shows video
            camOn=true;
            if(participants[myPeerId]){ participants[myPeerId].hasVideo=true; participants[myPeerId].stream=localStream; }
            const pkt2={type:'cam-status',hasVideo:true};
            if(isHost) broadcastAll({...pkt2,id:HOST_ID}); else if(hostConn&&hostConn.open) hostConn.send(pkt2);

            updateCtrlBtns();
            toast('Screen sharing ON');
        }catch(e){
            if(e.name!=='NotAllowedError') toast('Could not start screen share');
            screenOn=false; screenStream=null; updateCtrlBtns();
        }
    }else{
        stopScreenShare();
    }
}

function stopScreenShare(){
    screenOn=false;
    if(screenStream){ screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; }

    // Restore camera track (or remove video if cam was off)
    if(localStream){
        localStream.getVideoTracks().forEach(t=>{ localStream.removeTrack(t); t.stop(); });
    }

    // Try to re-add camera if we had permission
    if(hasVideoPermission){
        navigator.mediaDevices.getUserMedia({video:true}).then(camStr=>{
            const camTrack=camStr.getVideoTracks()[0];
            if(localStream) localStream.addTrack(camTrack);
            camTrack.enabled=camOn; // restore cam enabled state
            // Replace track in peers
            if(peer){
                Object.values(peer.connections).forEach(conns=>{
                    conns.forEach(conn=>{
                        if(conn.type==='media'&&conn.peerConnection){
                            const senders=conn.peerConnection.getSenders();
                            const vidSender=senders.find(s=>s.track&&s.track.kind==='video');
                            if(vidSender) vidSender.replaceTrack(camTrack).catch(e=>console.warn('replaceTrack err:',e));
                        }
                    });
                });
            }
        }).catch(()=>{});
    }

    // Update state
    if(participants[myPeerId]){ participants[myPeerId].isScreenSharing=false; participants[myPeerId].hasVideo=camOn; }
    renderAll();
    const pkt={type:'screen-status',isScreenSharing:false};
    if(isHost) broadcastAll({...pkt,id:HOST_ID}); else if(hostConn&&hostConn.open) hostConn.send(pkt);
    const pkt2={type:'cam-status',hasVideo:camOn};
    if(isHost) broadcastAll({...pkt2,id:HOST_ID}); else if(hostConn&&hostConn.open) hostConn.send(pkt2);

    updateCtrlBtns();
    toast('Screen sharing OFF');
}

let unsubLobbyCount=null;
function startLobbyCountListener(){
    if(unsubLobbyCount) return;
    unsubLobbyCount=db.collection('room').doc('main').onSnapshot(doc=>{
        const n=doc.exists?(doc.data().onlineCount||0):0;
        const pill=qs('joinOnlinePill'),cnt=qs('joinOnlineCount');
        if(n>0){ cnt.textContent=n; pill.style.display='inline-flex'; } else { pill.style.display='none'; }
    },()=>{});
}
function pushOnlineCount(){
    if(!isHost) return;
    db.collection('room').doc('main').set({onlineCount:Object.keys(participants).length},{merge:true}).catch(()=>{});
}

function applyGridLayout(grid,n){
    const isMobile=window.innerWidth<=700;
    grid.style.gridTemplateAreas='';
    if(n===0) return;
    if(n===1){ grid.style.gridTemplateColumns='1fr'; grid.style.gridTemplateRows='1fr'; return; }
    if(n===2){ if(isMobile){ grid.style.gridTemplateColumns='1fr'; grid.style.gridTemplateRows='1fr 1fr'; } else { grid.style.gridTemplateColumns='1fr 1fr'; grid.style.gridTemplateRows='1fr'; } return; }
    if(n===3){ if(isMobile){ grid.style.gridTemplateColumns='1fr 1fr'; grid.style.gridTemplateRows='3fr 2fr'; grid.style.gridTemplateAreas='"a a" "b c"'; } else { grid.style.gridTemplateColumns='13fr 7fr'; grid.style.gridTemplateRows='1fr 1fr'; grid.style.gridTemplateAreas='"a b" "a c"'; } return; }
    if(n===4){ grid.style.gridTemplateColumns='1fr 1fr'; grid.style.gridTemplateRows='1fr 1fr'; return; }
    if(n===5){ if(isMobile){ grid.style.gridTemplateColumns='1fr 1fr'; grid.style.gridTemplateRows='2fr 1fr 1fr'; grid.style.gridTemplateAreas='"a a" "b c" "d e"'; } else { grid.style.gridTemplateColumns='3fr 2fr 2fr'; grid.style.gridTemplateRows='1fr 1fr'; grid.style.gridTemplateAreas='"a b c" "a d e"'; } return; }
    if(n===6){ if(isMobile){ grid.style.gridTemplateColumns='1fr 1fr'; grid.style.gridTemplateRows='1fr 1fr 1fr'; } else { grid.style.gridTemplateColumns='1fr 1fr 1fr'; grid.style.gridTemplateRows='1fr 1fr'; } return; }
    if(n===7||n===8){ if(isMobile){ grid.style.gridTemplateColumns='1fr 1fr'; grid.style.gridTemplateRows=`repeat(${Math.ceil(n/2)}, 1fr)`; } else { grid.style.gridTemplateColumns='2fr 1fr 1fr'; grid.style.gridTemplateRows='1fr 1fr 1fr'; const others=['b','c','d','e','f','g','h'].slice(0,n-1); grid.style.gridTemplateAreas=`"a ${others.slice(0,2).join(' ')}" "a ${others.slice(2,4).join(' ')}" "a ${others.slice(4,6).join(' ')}"`; } return; }
    if(n<=9){ grid.style.gridTemplateColumns='1fr 1fr 1fr'; grid.style.gridTemplateRows='1fr 1fr 1fr'; return; }
    if(n<=12){ grid.style.gridTemplateColumns='1fr 1fr 1fr 1fr'; grid.style.gridTemplateRows=`repeat(${Math.ceil(n/4)}, 1fr)`; return; }
    const cols=Math.ceil(Math.sqrt(n));
    grid.style.gridTemplateColumns=`repeat(${cols}, 1fr)`;
    grid.style.gridTemplateRows=`repeat(${Math.ceil(n/cols)}, 1fr)`;
}

function renderAll(){
    const grid=qs('videoGrid'),plist=qs('peopleList'),dplist=qs('drawerPeopleList');
    grid.innerHTML=''; plist.innerHTML=''; dplist.innerHTML='';
    const ids=Object.keys(participants),n=ids.length;
    qs('onlineCount').textContent=n;
    pushOnlineCount();
    if(n===0){ grid.style.gridTemplateColumns='1fr'; grid.style.gridTemplateRows='1fr'; grid.style.gridTemplateAreas=''; grid.innerHTML='<div style="color:#555;text-align:center;padding:40px;display:flex;align-items:center;justify-content:center;grid-column:1/-1;">Waiting for others to join...</div>'; return; }
    const ordered=[myPeerId,...ids.filter(id=>id!==myPeerId)];
    const useSpotlight=n>=3&&n<=8;
    const areaLetters=['a','b','c','d','e','f','g','h'];
    applyGridLayout(grid,n);
    const hasAreas=!!(grid.style.gridTemplateAreas&&grid.style.gridTemplateAreas!=='none'&&grid.style.gridTemplateAreas!=='');
    ordered.forEach((id,idx)=>{
        const p=participants[id]; if(!p) return;
        const isMe=(id===myPeerId);
        const isSpotlight=isMe&&useSpotlight&&hasAreas;
        const isScreen=isMe?screenOn:(p.isScreenSharing||false);
        const tile=document.createElement('div');
        tile.className='vtile'+(isSpotlight?' spotlight':'')+(isScreen?' screensharing':'');
        if(hasAreas&&idx<areaLetters.length) tile.style.gridArea=areaLetters[idx];
        let showVid=false;
        if(isMe){ showVid=(camOn||screenOn)&&localStream!=null&&localStream.getVideoTracks().some(t=>t.enabled&&t.readyState==='live'); }
        else { showVid=p.hasVideo&&p.stream!=null&&p.stream.getVideoTracks().some(t=>t.readyState==='live'); }
        if(showVid){
            const vid=document.createElement('video'); vid.autoplay=true; vid.playsInline=true; vid.muted=isMe;
            vid.srcObject=isMe?localStream:p.stream; tile.appendChild(vid);
            if(!isMe) ensureAudioPlaying(p.stream,id);
        }else{
            const ov=document.createElement('div'); ov.className='av-overlay';
            const img=document.createElement('img'); img.src=isMe?myPicUrl:(p.pic||PICS[0]); img.onerror=()=>img.src=PICS[0];
            const nm=document.createElement('span'); nm.textContent=p.name+(isMe?' (you)':'');
            ov.append(img,nm); tile.appendChild(ov);
        }
        // Screen share badge
        const sb=document.createElement('div'); sb.className='screen-badge'+(isScreen?' show':'');
        sb.innerHTML='🖥 Screen'; tile.appendChild(sb);
        const lbl=document.createElement('div'); lbl.className='name-label';
        const limg=document.createElement('img'); limg.src=isMe?myPicUrl:(p.pic||PICS[0]); limg.onerror=()=>limg.src=PICS[0];
        lbl.append(limg,document.createTextNode(p.name+(isMe?' (you)':''))); tile.appendChild(lbl);
        const mb=document.createElement('div'); mb.className='mute-icon'+(p.muted?' show':''); mb.textContent='🔇'; tile.appendChild(mb);
        grid.appendChild(tile);
        function makePerson(){
            const pi=document.createElement('div'); pi.className='person';
            const pimg=document.createElement('img'); pimg.src=isMe?myPicUrl:(p.pic||PICS[0]); pimg.onerror=()=>pimg.src=PICS[0];
            const pn=document.createElement('span'); pn.className='person-name'; pn.textContent=p.name+(isMe?' (you)':'')+(isScreen?' 🖥':'');
            pi.append(pimg,pn); return pi;
        }
        plist.appendChild(makePerson()); dplist.appendChild(makePerson());
    });
}
window.addEventListener('resize',()=>{ if(qs('app').style.display!=='none') renderAll(); });

function addMsg(name,text,time,isMe){
    function makeMsg(){
        const d=document.createElement('div'); d.className='msg'+(isMe?' me':'');
        d.innerHTML=`<div class="msg-head"><span class="msg-name${isMe?' me':''}">${esc(name)}</span><span class="msg-time">${esc(time)}</span></div><div class="msg-body">${esc(text)}</div>`;
        return d;
    }
    const c1=qs('chatMsgs'); c1.appendChild(makeMsg()); c1.scrollTop=c1.scrollHeight;
    const c2=qs('drawerChatMsgs'); c2.appendChild(makeMsg()); c2.scrollTop=c2.scrollHeight;
}
function addSysMsg(text){
    function makeSys(){ const d=document.createElement('div'); d.className='msg sys'; d.innerHTML=`<div class="msg-body">— ${esc(text)}</div>`; return d; }
    const c1=qs('chatMsgs'); c1.appendChild(makeSys()); c1.scrollTop=c1.scrollHeight;
    const c2=qs('drawerChatMsgs'); c2.appendChild(makeSys()); c2.scrollTop=c2.scrollHeight;
}
function sendChat(){
    const mobileActive=window.innerWidth<=700;
    const inp=mobileActive?qs('drawerChatIn'):qs('chatIn');
    const text=inp.value.trim(); if(!text) return;
    inp.value=''; const time=hhmm();
    addMsg(myName,text,time,true);
    const pkt={type:'chat',name:myName,text,time};
    if(isHost){ broadcastAll(pkt); } else if(hostConn&&hostConn.open){ hostConn.send(pkt); }
}
qs('chatIn').onkeypress=e=>{ if(e.key==='Enter') sendChat(); };
qs('sendBtn').onclick=sendChat;
qs('drawerChatIn').onkeypress=e=>{ if(e.key==='Enter') sendChat(); };
qs('drawerSendBtn').onclick=sendChat;

function toggleMic(){
    micOn=!micOn;
    if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
    if(participants[myPeerId]) participants[myPeerId].muted=!micOn;
    renderAll(); updateCtrlBtns(); toast(micOn?'Microphone ON':'Microphone OFF');
    const pkt={type:'mute-status',muted:!micOn};
    if(isHost) broadcastAll({...pkt,id:HOST_ID}); else if(hostConn&&hostConn.open) hostConn.send(pkt);
}
function toggleCam(){
    if(screenOn){ toast('Stop screen sharing first to switch to camera'); return; }
    if(!hasVideoPermission){ toast('Camera not available — close other apps using it and rejoin'); return; }
    const vTracks=localStream?localStream.getVideoTracks():[];
    if(vTracks.length===0){ toast('No camera track found — try rejoining'); return; }
    camOn=!camOn; vTracks.forEach(t=>{ t.enabled=camOn; });
    if(participants[myPeerId]){ participants[myPeerId].hasVideo=camOn; participants[myPeerId].stream=localStream; }
    renderAll(); updateCtrlBtns(); toast(camOn?'Camera ON':'Camera OFF');
    const pkt={type:'cam-status',hasVideo:camOn};
    if(isHost) broadcastAll({...pkt,id:HOST_ID}); else if(hostConn&&hostConn.open) hostConn.send(pkt);
}
function updateCtrlBtns(){
    const m=qs('micBtn'),c=qs('camBtn'),s=qs('screenBtn');
    m.className='toggle-pill '+(micOn?'state-on':'state-off'); m.querySelector('.pill-text').textContent=micOn?'ON':'OFF';
    c.className='toggle-pill '+(camOn&&!screenOn?'state-on':'state-off'); c.querySelector('.pill-text').textContent=(camOn&&!screenOn)?'ON':'OFF';
    if(screenOn){ s.className='toggle-pill state-screen'; s.querySelector('.pill-text').textContent='Stop'; }
    else { s.className='toggle-pill state-off'; s.querySelector('.pill-text').textContent='Share'; }
}

function exitCall(){
    cancelTakeover(); stopHeartbeat();
    if(screenOn) stopScreenShare();
    if(isHost){
        db.collection('room').doc('main').set({onlineCount:0},{merge:true}).catch(()=>{});
        Object.values(connections).forEach(c=>{ try{ c.call?.close(); }catch(e){} try{ c.conn?.close(); }catch(e){} if(c.relays) Object.values(c.relays).forEach(r=>{ try{ r.close(); }catch(e){} }); });
    }else{ try{ hostConn?.close(); }catch(e){} }
    Object.keys(audioElements).forEach(cleanupAudioElement);
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
    try{ peer?.destroy(); }catch(e){}
    peer=null; hostConn=null; participants={}; connections={};
    isHost=false; myPeerId=''; micOn=true; camOn=false; hasVideoPermission=false; screenOn=false; screenStream=null;
    qs('chatMsgs').innerHTML=''; qs('drawerChatMsgs').innerHTML='';
    qs('app').style.display='none'; qs('authWrap').style.display='block';
    updateCtrlBtns();
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

qs('micBtn').onclick=toggleMic;
qs('camBtn').onclick=toggleCam;
qs('screenBtn').onclick=toggleScreen;
qs('endBtn').onclick=exitCall;

document.querySelectorAll('.tab').forEach(tab=>{
    tab.onclick=()=>{
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active');
        const which=tab.dataset.tab;
        qs('chatPanel').classList.toggle('active',which==='chat'); qs('peoplePanel').classList.toggle('active',which==='people');
    };
});

function openDrawer(){ qs('mobileDrawer').classList.add('open'); qs('drawerOverlay').classList.add('open'); }
function closeDrawer(){ qs('mobileDrawer').classList.remove('open'); qs('drawerOverlay').classList.remove('open'); }
qs('drawerToggleBtn').onclick=openDrawer;
qs('drawerClose').onclick=closeDrawer;
qs('drawerOverlay').onclick=closeDrawer;

document.querySelectorAll('.drawer-tab').forEach(tab=>{
    tab.onclick=()=>{
        document.querySelectorAll('.drawer-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active');
        const which=tab.dataset.dtab;
        qs('drawerChatPanel').classList.toggle('active',which==='chat'); qs('drawerPeoplePanel').classList.toggle('active',which==='people');
    };
});

qs('fullscreenBtn').onclick=()=>{
    const appEl=qs('app');
    if(!document.fullscreenElement){ (appEl.requestFullscreen||appEl.webkitRequestFullscreen||appEl.mozRequestFullScreen).call(appEl).catch(e=>console.warn('Fullscreen err:',e)); }
    else { (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen).call(document).catch(e=>console.warn('Exit fullscreen err:',e)); }
};
document.addEventListener('fullscreenchange',()=>{ qs('fullscreenBtn').textContent=document.fullscreenElement?'✕':'⛶'; qs('fullscreenBtn').title=document.fullscreenElement?'Exit Fullscreen':'Fullscreen'; });
document.addEventListener('webkitfullscreenchange',()=>{ const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement); qs('fullscreenBtn').textContent=isFs?'⊠':'⛶'; });
</script>
