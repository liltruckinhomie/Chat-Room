<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Homie Chat – Video & Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { height:100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d1a;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== AUTH ===== */
        #authWrap {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
            z-index: 100;
        }
        .auth-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 20px 16px;
            width: 320px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.22);
            border: 1px solid rgba(255,255,255,0.25);
            position: relative;
        }
        .auth-btn {
            width:100%; padding:9px; margin:4px 0;
            background: linear-gradient(145deg,#1877f2,#1658d4);
            color:white; border:none; border-radius:6px;
            font-size:13px; font-weight:600; cursor:pointer;
            transition: opacity .15s;
        }
        .auth-btn:hover { opacity:0.9; }
        .form-input {
            width:100%; padding:8px; margin:5px 0;
            background:rgba(255,255,255,0.85);
            border:1px solid rgba(0,0,0,0.12);
            border-radius:5px; font-size:13px; outline:none;
        }
        .form-input:focus { border-color:#1877f2; }
        .error-msg { color:#ff4242; font-size:11px; min-height:14px; margin:2px 0; }
        .hidden { display:none !important; }
        .back-btn {
            position:absolute; top:10px; right:12px;
            background:none; border:none; color:#1877f2;
            font-size:18px; cursor:pointer; line-height:1;
        }
        .form-title { font-size:15px; margin:4px 0 12px; text-align:center; font-weight:600; color:#222; }
        .main-buttons { margin-top:8px; }
        .user-info { display:flex; align-items:center; gap:10px; margin:8px 0 14px; }
        .profile-picture { width:48px; height:48px; border-radius:50%; object-fit:cover; border:2px solid #1877f2; flex-shrink:0; }
        .welcome-text { font-size:18px; font-weight:600; color:#222; }
        .welcome-name { color:#1877f2; }
        .join-btn {
            width:100%; padding:10px; margin:4px 0;
            background: linear-gradient(145deg,#4285F4,#1a73e8);
            color:white; border:none; border-radius:6px;
            font-size:15px; font-weight:600; cursor:pointer;
            transition: opacity .15s;
        }
        .join-btn:hover { opacity:0.92; }
        .signout-btn {
            position:absolute; top:8px; right:8px;
            padding:5px 10px;
            background:rgba(255,0,0,0.08); color:#e03;
            border:1px solid rgba(255,0,0,0.18);
            border-radius:6px; font-size:11px; font-weight:600; cursor:pointer;
        }
        .join-online-pill {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25);
            color: #4ade80; padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600; margin-bottom: 10px;
        }
        .join-online-dot { width:7px; height:7px; border-radius:50%; background:#4ade80; animation:pulse 1.5s infinite; }
        .ban-box {
            background:rgba(255,0,0,0.08); border:1px solid rgba(255,0,0,0.25);
            border-radius:8px; padding:10px 12px; margin:8px 0;
            text-align:center; font-size:13px;
        }
        .ban-box .ban-name { font-weight:700; color:#c00; font-size:14px; margin-bottom:4px; }
        .ban-box .ban-detail { color:#555; font-size:12px; margin:2px 0; }

        /* ===== APP ===== */
        #app {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            flex-direction: column;
            background: #1a1a2e;
        }

        .topbar {
            background:#16213e; color:white;
            padding: 10px 16px;
            padding-top: max(10px, env(safe-area-inset-top));
            display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid #2c3e66; flex-shrink:0;
            z-index: 5;
        }
        .online-pill { background:#2c3e66; padding:4px 12px; border-radius:20px; font-size:12px; }
        .online-dot { display:inline-block; width:8px; height:8px; background:#4ade80; border-radius:50%; margin-right:5px; animation:pulse 1.5s infinite; }
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .top-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid #1877f2; }
        .top-name { color:white; font-size:13px; font-weight:600; }
        .topbar-right { display:flex; align-items:center; gap:10px; }
        .fullscreen-btn {
            background:rgba(255,255,255,0.08); border:none;
            width:32px; height:32px; border-radius:7px;
            color:#ccc; cursor:pointer; font-size:15px;
            display:flex; align-items:center; justify-content:center;
        }
        .fullscreen-btn:hover { background:rgba(255,255,255,0.16); }

        .app-body { display:flex; flex:1; overflow:hidden; min-height:0; }

        .video-grid {
            flex:1;
            display:grid;
            gap:6px;
            padding:6px;
            background:#0a0a14;
            overflow:hidden;
            min-height:0;
            min-width:0;
            align-content:center;
            justify-content:center;
        }

        .vtile {
            position:relative;
            background:#1c1c2e;
            border-radius:12px;
            overflow:hidden;
            min-height:0; min-width:0;
            border:2px solid rgba(255,255,255,0.15);
        }
        .vtile.spotlight { border:2px solid rgba(255,255,255,0.3); }
        .vtile.screensharing {
            border:2px solid rgba(124,58,237,0.8);
            box-shadow:0 0 14px rgba(124,58,237,0.35);
        }
        .vtile video {
            width:100%; height:100%;
            object-fit:contain;
            display:block;
            background:#0a0a14;
        }
        .vtile .av-overlay {
            position:absolute; inset:0;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background:#1c1c2e; gap:10px;
        }
        .vtile .av-overlay img { width:80px; height:80px; border-radius:50%; border:3px solid #1877f2; object-fit:cover; }
        .vtile .av-overlay span { color:#ccc; font-size:13px; font-weight:500; }
        .vtile.spotlight .av-overlay img { width:110px; height:110px; }
        .vtile.spotlight .av-overlay span { font-size:15px; }

        .vtile .name-label {
            position:absolute; bottom:8px; left:8px;
            background:rgba(0,0,0,0.7); padding:4px 10px;
            border-radius:20px; font-size:11px; color:white;
            display:flex; align-items:center; gap:5px; z-index:3;
            backdrop-filter:blur(4px);
        }
        .vtile .name-label img { width:18px; height:18px; border-radius:50%; }
        .vtile .mute-icon {
            position:absolute; top:8px; right:8px;
            background:rgba(220,38,38,0.85); width:26px; height:26px;
            border-radius:50%; display:none; align-items:center; justify-content:center;
            font-size:13px; z-index:3;
        }
        .vtile .mute-icon.show { display:flex; }
        .screen-badge {
            position:absolute; top:8px; left:8px;
            background:rgba(124,58,237,0.85); padding:3px 8px; border-radius:20px;
            font-size:10px; color:white; font-weight:700; letter-spacing:0.04em;
            z-index:3; display:none; align-items:center; gap:3px; backdrop-filter:blur(4px);
        }
        .screen-badge.show { display:flex; }

        .vtile .zoom-btn {
            position:absolute; top:8px; right:8px;
            background:rgba(0,0,0,0.55); border:none;
            width:28px; height:28px; border-radius:7px;
            color:white; cursor:pointer; font-size:14px;
            display:flex; align-items:center; justify-content:center;
            z-index:4; opacity:0; transition:opacity 0.18s;
            backdrop-filter:blur(4px);
        }
        .vtile:hover .zoom-btn { opacity:1; }
        @media(max-width:700px){ .vtile .zoom-btn { opacity:0.75; } }
        .vtile .mute-icon.show ~ .zoom-btn,
        .vtile .zoom-btn.muted-shift { right: 42px; }

        /* Cam-recovering indicator */
        .vtile .cam-recovering {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.7); color:#aaa; font-size:11px;
            padding:5px 10px; border-radius:20px; z-index:5;
            display:none; align-items:center; gap:5px;
            backdrop-filter:blur(4px);
        }
        .vtile .cam-recovering.show { display:flex; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .spin-icon { display:inline-block; animation:spin 1s linear infinite; }

        /* Per-tile fullscreen */
        .tile-fs-wrap {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 600;
            background: #000;
            align-items: center;
            justify-content: center;
        }
        .tile-fs-wrap.open { display: flex; }
        .tile-fs-wrap video { width:100%; height:100%; object-fit:contain; }
        .tile-fs-wrap .av-overlay {
            position:absolute; inset:0;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:14px;
        }
        .tile-fs-wrap .av-overlay img { width:140px; height:140px; border-radius:50%; border:4px solid #1877f2; object-fit:cover; }
        .tile-fs-wrap .av-overlay span { color:#ccc; font-size:18px; font-weight:500; }
        .tile-fs-close {
            position:absolute; top:16px; right:16px;
            background:rgba(0,0,0,0.6); border:none; color:white;
            width:40px; height:40px; border-radius:50%; font-size:20px;
            cursor:pointer; z-index:7; display:flex; align-items:center; justify-content:center;
            backdrop-filter:blur(6px);
        }
        .tile-fs-name {
            position:absolute; bottom:max(20px,env(safe-area-inset-bottom)); left:20px;
            background:rgba(0,0,0,0.7); padding:6px 14px; border-radius:20px;
            font-size:14px; color:white; z-index:7;
            display:flex; align-items:center; gap:8px;
        }
        .tile-fs-name img { width:22px; height:22px; border-radius:50%; }

        /* ── CONFETTI CANVAS ── */
        .confetti-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            border-radius: 12px;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width:300px; background:rgba(255,255,255,0.03);
            border-left:1px solid rgba(255,255,255,0.07);
            display:flex; flex-direction:column; flex-shrink:0;
        }
        .tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.07); }
        .tab { flex:1; padding:11px; text-align:center; color:#777; cursor:pointer; font-size:13px; }
        .tab.active { color:#60a5fa; border-bottom:2px solid #60a5fa; }
        .panel { display:none; flex:1; overflow:hidden; flex-direction:column; min-height:0; }
        .panel.active { display:flex; }
        .chat-msgs { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:6px; }
        .msg { display:flex; flex-direction:column; gap:3px; }
        .msg-head { display:flex; align-items:baseline; gap:7px; }
        .msg-name { font-size:11px; font-weight:600; color:#60a5fa; }
        .msg-name.me { color:#a78bfa; }
        .msg-time { font-size:10px; color:#444; }
        .msg-body { font-size:13px; color:#ddd; background:rgba(255,255,255,0.05); padding:7px 11px; border-radius:10px; word-break:break-word; }
        .msg.me .msg-body { background:rgba(96,165,250,0.15); }
        .msg.sys .msg-body { background:none; color:#555; font-style:italic; padding:3px 0; }
        .msg.cmd .msg-body { background:rgba(124,58,237,0.18); color:#c4b5fd; }
        .chat-input { padding:9px; border-top:1px solid rgba(255,255,255,0.07); display:flex; gap:7px; }
        .chat-input input {
            flex:1; padding:9px 12px;
            background:rgba(255,255,255,0.07);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:20px; color:white; font-size:13px; outline:none;
        }
        .chat-input input::placeholder { color: #555; }
        .chat-input button { width:34px; height:34px; background:#1877f2; border:none; border-radius:50%; color:white; cursor:pointer; font-size:16px; }
        .people-list { flex:1; overflow-y:auto; padding:9px; }
        .person { display:flex; align-items:center; gap:9px; padding:9px; background:rgba(255,255,255,0.05); border-radius:9px; margin-bottom:5px; }
        .person img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
        .person-name { flex:1; font-size:13px; color:#ddd; }

        /* Commands hint box */
        .cmd-hint {
            background: rgba(124,58,237,0.12);
            border: 1px solid rgba(124,58,237,0.3);
            border-radius:8px; padding:8px 10px; margin:6px 9px;
            font-size:11px; color:#c4b5fd; line-height:1.7;
        }
        .cmd-hint b { color:#e9d5ff; }

        /* ── CONTROLS ── */
        .controls {
            background: #16213e;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            border-top: 1px solid #2c3e66;
            flex-shrink: 0;
            flex-wrap: nowrap;
            position: relative;
            z-index: 10;
            padding: 10px 16px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        .toggle-group { display:flex; flex-direction:column; align-items:center; gap:3px; }
        .toggle-label { font-size:9px; color:#888; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }

        .toggle-pill {
            height:38px; min-width:86px; padding:0 14px;
            border-radius:19px; border:none; cursor:pointer;
            font-size:13px; font-weight:600;
            transition:background 0.2s, box-shadow 0.2s;
            display:flex; align-items:center; justify-content:center; gap:6px;
            white-space:nowrap; letter-spacing:0.01em;
        }
        .toggle-pill .pill-emoji { font-size:15px; line-height:1; }
        .toggle-pill .pill-state { font-size:12px; opacity:0.9; font-weight:700; }
        .toggle-pill.state-on  { background:#1877f2; color:white; box-shadow:0 0 12px rgba(24,119,242,0.5); }
        .toggle-pill.state-off { background:rgba(255,255,255,0.09); color:#999; }
        .toggle-pill.state-screen { background:linear-gradient(135deg,#7c3aed,#4f46e5); color:white; box-shadow:0 0 14px rgba(124,58,237,0.55); }
        .toggle-pill.state-disabled { background:rgba(255,255,255,0.04); color:#555; cursor:not-allowed; }

        .end-btn {
            width:48px; height:48px; border-radius:50%; border:none;
            background:#dc2626; color:white; font-size:18px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
            transition: background .15s;
        }
        .end-btn:hover { background:#b91c1c; }

        /* Mobile drawer */
        .mobile-drawer-btn { display:none; }
        .mobile-drawer-overlay { display:none; }
        .mobile-drawer { display:none; }

        @media (max-width:700px) {
            .sidebar { display:none !important; }
            .mobile-drawer-btn { display:flex; flex-direction:column; align-items:center; gap:3px; }
            .controls { gap:8px; padding:8px 8px; padding-bottom:max(12px,env(safe-area-inset-bottom)); flex-wrap:nowrap; }
            .toggle-pill { height:34px; min-width:66px; font-size:11px; padding:0 8px; gap:4px; }
            .toggle-pill .pill-emoji { font-size:14px; }
            .end-btn { width:42px; height:42px; font-size:16px; }
            .top-name { display:none; }
            .topbar { padding:8px 12px; padding-top:max(8px,env(safe-area-inset-top)); }

            .mobile-drawer-overlay {
                display:block; position:fixed; inset:0;
                background:rgba(0,0,0,0.55); z-index:200;
                opacity:0; pointer-events:none; transition:opacity 0.22s;
            }
            .mobile-drawer-overlay.open { opacity:1; pointer-events:all; }
            .mobile-drawer {
                display:flex; flex-direction:column;
                position:fixed; bottom:0; left:0; right:0; height:72vh;
                background:#16213e; border-radius:18px 18px 0 0;
                border-top:1px solid #2c3e66; z-index:201;
                transform:translateY(100%);
                transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
                padding-bottom:env(safe-area-inset-bottom);
            }
            .mobile-drawer.open { transform:translateY(0); }
            .drawer-handle { width:38px; height:4px; background:#444; border-radius:2px; margin:10px auto 0; flex-shrink:0; }
            .drawer-close { position:absolute; top:10px; right:14px; background:none; border:none; color:#888; font-size:20px; cursor:pointer; }
            .drawer-tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.07); flex-shrink:0; margin-top:6px; }
            .drawer-tab { flex:1; padding:11px; text-align:center; color:#777; cursor:pointer; font-size:13px; }
            .drawer-tab.active { color:#60a5fa; border-bottom:2px solid #60a5fa; }
            .drawer-panel { display:none; flex:1; overflow:hidden; flex-direction:column; min-height:0; }
            .drawer-panel.active { display:flex; }
        }

        .toast {
            position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
            background:#222; color:white; padding:7px 16px;
            border-radius:30px; font-size:13px; opacity:0;
            transition:opacity .2s; pointer-events:none; z-index:9999;
            max-width:90vw; text-align:center;
        }
        .toast.show { opacity:1; }
    </style>
</head>
<body>

<div id="authWrap">
    <div class="auth-container" id="authMain">
        <div id="banBox" class="ban-box hidden">
            <div class="ban-name" id="banName"></div>
            <div class="ban-detail" id="banReasonLine"></div>
            <div class="ban-detail" id="banUntilLine"></div>
        </div>
        <div id="authBtns" class="main-buttons">
            <button id="showSignup" class="auth-btn">Sign Up</button>
            <button id="showLogin"  class="auth-btn">Sign In</button>
        </div>
        <div id="userDisplay" class="hidden">
            <div class="user-info">
                <img id="profilePic" class="profile-picture" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png">
                <div><div class="welcome-text">Welcome, <span class="welcome-name" id="displayName"></span>!</div></div>
            </div>
            <div class="join-online-pill" id="joinOnlinePill" style="display:none">
                <span class="join-online-dot"></span>
                <span id="joinOnlineCount">0</span> in call
            </div>
            <button class="join-btn" id="joinBtn">Join Call</button>
            <button id="signoutBtn" class="signout-btn">Sign Out</button>
        </div>
    </div>
    <div class="auth-container hidden" id="signupPanel">
        <button class="back-btn" id="backFromSignup">&#x2715;</button>
        <h3 class="form-title">Create Account</h3>
        <input type="text"     id="signupUser" class="form-input" placeholder="Username">
        <input type="password" id="signupPass" class="form-input" placeholder="Password (6+ chars)">
        <div class="error-msg" id="signupErr"></div>
        <button id="doSignup" class="auth-btn">Sign Up</button>
    </div>
    <div class="auth-container hidden" id="loginPanel">
        <button class="back-btn" id="backFromLogin">&#x2715;</button>
        <h3 class="form-title">Sign In</h3>
        <input type="text"     id="loginUser" class="form-input" placeholder="Username">
        <input type="password" id="loginPass" class="form-input" placeholder="Password">
        <div class="error-msg" id="loginErr"></div>
        <button id="doLogin" class="auth-btn">Sign In</button>
    </div>
</div>

<!-- Per-tile fullscreen overlay -->
<div class="tile-fs-wrap" id="tileFsWrap">
    <button class="tile-fs-close" id="tileFsClose">✕</button>
    <video id="tileFsVideo" autoplay playsinline muted></video>
    <div class="av-overlay hidden" id="tileFsOverlay">
        <img id="tileFsImg" src="">
        <span id="tileFsName2"></span>
    </div>
    <div class="tile-fs-name" id="tileFsLabel">
        <img id="tileFsLabelImg" src=""> <span id="tileFsLabelName"></span>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div class="online-pill"><span class="online-dot"></span><span id="onlineCount">1</span> online</div>
        <div class="topbar-right">
            <img id="topAvatar" class="top-avatar" src="">
            <span id="topName" class="top-name"></span>
            <button class="fullscreen-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
        </div>
    </div>
    <div class="app-body">
        <div class="video-grid" id="videoGrid"></div>
        <div class="sidebar">
            <div class="tabs">
                <div class="tab active" data-tab="chat">Chat</div>
                <div class="tab"        data-tab="people">People</div>
            </div>
            <div class="panel active" id="chatPanel">
                <div class="cmd-hint">
                    <b>Fun commands:</b><br>
                    /confetti — shoots confetti for everyone<br>
                    /barrelroll — everyone does a 360<br>
                    /spring — everyone bounces
                </div>
                <div class="chat-msgs" id="chatMsgs"></div>
                <div class="chat-input">
                    <input id="chatIn" type="text" placeholder="Message...">
                    <button id="sendBtn">➤</button>
                </div>
            </div>
            <div class="panel" id="peoplePanel">
                <div class="people-list" id="peopleList"></div>
            </div>
        </div>
    </div>

function parseBan(f){
    if(!f) return null;
    try{
        if(f.toLowerCase().includes('forever')) return{reason:f.split('/')[0],forever:true};
        const p=f.split('/');
        if(p.length===5){const fy=parseInt(p[4])<100?2000+parseInt(p[4]):parseInt(p[4]);return{reason:p[0],time:p[1],until:new Date(fy,parseInt(p[3])-1,parseInt(p[2]),parseInt(p[1].substring(0,2)),parseInt(p[1].substring(2,4))),forever:false};}
        if(p.length===4){const fy=parseInt(p[3])<100?2000+parseInt(p[3]):parseInt(p[3]);return{reason:p[0],until:new Date(fy,parseInt(p[2])-1,parseInt(p[1])),forever:false};}
    }catch(e){}
    return null;
}
function isBanned(f){const b=parseBan(f);return b&&(b.forever||new Date()<b.until);}
function isBanExpired(f){const b=parseBan(f);return b&&!b.forever&&new Date()>=b.until;}
function showBanUI(username,b){
    qs('banName').textContent=b.forever?`${username} is permanently banned`:`${username} has been banned`;
    qs('banReasonLine').textContent='Reason: '+b.reason;
    if(!b.forever&&b.until){const ds=b.until.toLocaleDateString('en-GB');const ts=b.time?` ${b.time.substring(0,2)}:${b.time.substring(2,4)}`:'';qs('banUntilLine').textContent='Until: '+ds+ts;qs('banUntilLine').classList.remove('hidden');}
    else{qs('banUntilLine').classList.add('hidden');}
    qs('banBox').classList.remove('hidden');lastBannedUser=username;
    qs('signupPanel').classList.add('hidden');qs('loginPanel').classList.add('hidden');qs('authMain').style.display='block';
    qs('authBtns').classList.remove('hidden');qs('userDisplay').classList.add('hidden');
}
function hideBanUI(){qs('banBox').classList.add('hidden');lastBannedUser=null;}
async function checkAndHandleBan(uid,username){
    const doc=await db.collection('users').doc(uid).get();
    if(!doc.exists) return false;
    const d=doc.data();
    if(d.banned&&isBanExpired(d.banned)){await db.collection('users').doc(uid).update({banned:firebase.firestore.FieldValue.delete()});hideBanUI();return false;}
    if(d.banned&&isBanned(d.banned)){showBanUI(username,parseBan(d.banned));await auth.signOut();return true;}
    hideBanUI();return false;
}

}

// ─────────────────────────────────────────────
// MEDIA INIT — robust mobile fallback chain
// ─────────────────────────────────────────────
async function initMedia(){
    hasVideoPermission=false; localStream=null; originalMicTrack=null;
    const audioCfg={echoCancellation:true,noiseSuppression:true,autoGainControl:true};

    const attempts=[
        {audio:audioCfg, video:isMobile?{facingMode:'user'}:true},
        {audio:audioCfg, video:true},
        {audio:audioCfg, video:{width:{ideal:640},height:{ideal:480}}},
    ];
    for(const cfg of attempts){
        try{localStream=await navigator.mediaDevices.getUserMedia(cfg);hasVideoPermission=true;break;}
        catch(e){if(e.name==='NotAllowedError') break;}
    }
    if(!localStream){
        try{localStream=await navigator.mediaDevices.getUserMedia({audio:audioCfg});}
        catch(e){try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e2){localStream=new MediaStream();micOn=false;}}
    }

    micOn=localStream.getAudioTracks().length>0;
    camOn=false;
    localStream.getVideoTracks().forEach(t=>{t.enabled=false;});
    const mic=localStream.getAudioTracks()[0];
    if(mic) originalMicTrack=mic;

    if(hasVideoPermission) toast('Mic ON · Camera OFF');
    else if(micOn) toast('Audio only — camera not available');
    else toast('No media — check permissions');

    updateCtrlBtns();
    startVideoWatchdog();
    tryBecomeHost();
}

// ─────────────────────────────────────────────
// CAMERA RECOVERY — persistent auto-heal for local camera
// ─────────────────────────────────────────────
function startCamRecovery(){
    if(camIsRecovering||camRecoveryTimer) return;
    if(camRecoveryAttempts>=CAM_RECOVERY_MAX){
        console.warn('[camRecovery] Max attempts reached, giving up');
        camOn=false;
        if(participants[myPeerId]) participants[myPeerId].hasVideo=false;
        updateCtrlBtns();renderAll();
        const pkt={type:'cam-status',hasVideo:false};
        if(isHost)broadcastAll({...pkt,id:HOST_ID});else if(hostConn?.open)hostConn.send(pkt);
        return;
    }
    camIsRecovering=true;
    const delay=CAM_RECOVERY_INTERVALS[Math.min(camRecoveryAttempts,CAM_RECOVERY_INTERVALS.length-1)];
    console.log(`[camRecovery] attempt ${camRecoveryAttempts+1} in ${delay}ms`);
    camRecoveryTimer=setTimeout(async()=>{
        camRecoveryTimer=null;
        camIsRecovering=false;
        if(!camOn||screenOn||!localStream) return; // no longer needed
        camRecoveryAttempts++;
        try{
            let s;
            try{s=await navigator.mediaDevices.getUserMedia({video:isMobile?{facingMode:'user'}:true,audio:false});}
            catch(e){s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
            const t=s.getVideoTracks()[0];
            if(!t) throw new Error('no track');
            // Remove old dead tracks
            localStream.getVideoTracks().forEach(old=>{localStream.removeTrack(old);old.stop();});
            localStream.addTrack(t);
            t.enabled=true;
            replaceTrackInPeers(t,'video');
            setTimeout(()=>replaceTrackInPeers(t,'video'),400);
            if(participants[myPeerId]){participants[myPeerId].hasVideo=true;participants[myPeerId].stream=localStream;}
            camRecoveryAttempts=0; // success — reset counter
            renderAll();updateCtrlBtns();
            console.log('[camRecovery] Camera restored successfully');
            const pkt={type:'cam-status',hasVideo:true};
            if(isHost)broadcastAll({...pkt,id:HOST_ID});else if(hostConn?.open)hostConn.send(pkt);
        }catch(e){
            console.warn('[camRecovery] attempt failed:',e.message);
            startCamRecovery(); // schedule next attempt
        }
    }, delay);
}

function stopCamRecovery(){
    if(camRecoveryTimer){clearTimeout(camRecoveryTimer);camRecoveryTimer=null;}
    camIsRecovering=false;
    camRecoveryAttempts=0;
}

// ─────────────────────────────────────────────
// VIDEO WATCHDOG — constantly monitors and repairs
// ─────────────────────────────────────────────
function startVideoWatchdog(){
    if(videoWatchdogTimer) clearInterval(videoWatchdogTimer);
    videoWatchdogTimer=setInterval(async()=>{
        if(!localStream) return;
        const grid=qs('videoGrid');
        if(!grid) return;

        // 1. Monitor remote tiles
        grid.querySelectorAll('.vtile[data-peer-id]').forEach(tile=>{
            const pid=tile.dataset.peerId;
            if(!pid||pid===myPeerId) return;
            const p=participants[pid];
            if(!p) return;
            if(!p.hasVideo||!p.stream) return;

            const vid=tile.querySelector('video');
            if(!vid){
                upsertParticipant(pid,p.name,p.pic,p.stream,p.muted,p.hasVideo,p.isScreenSharing);
                return;
            }

            // Detect frozen/black video using readyState
            if(vid.readyState<2 && !vid.error){
                if(!trackHealth[pid]) trackHealth[pid]={stallCount:0};
                trackHealth[pid].stallCount=(trackHealth[pid].stallCount||0)+1;
                if(trackHealth[pid].stallCount>=3){
                    // Try to unfreeze by reassigning srcObject
                    vid.srcObject=null;
                    vid.srcObject=p.stream;
                    vid.play().catch(()=>{});
                    trackHealth[pid].stallCount=0;
                }
            } else {
                if(trackHealth[pid]) trackHealth[pid].stallCount=0;
            }
        });

        // 2. Monitor own camera if it should be on
        if(camOn && !screenOn && localStream){
            const vTracks=localStream.getVideoTracks();
            const alive=vTracks.some(t=>t.enabled&&t.readyState==='live');
            const myTile=grid.querySelector(`.vtile[data-peer-id="${myPeerId}"]`);

            if(myTile){
                const myVid=myTile.querySelector('video');
                // Show/hide recovering indicator
                let rec=myTile.querySelector('.cam-recovering');
                if(!rec){
                    rec=document.createElement('div');
                    rec.className='cam-recovering';
                    rec.innerHTML='<span class="spin-icon">↻</span> Reconnecting...';
                    myTile.appendChild(rec);
                }
                if(!alive){
                    rec.classList.add('show');
                }else{
                    rec.classList.remove('show');
                }
                if(myVid && myVid.readyState<2){
                    myVid.srcObject=null;
                    myVid.srcObject=localStream;
                    myVid.play().catch(()=>{});
                }
            }

            // If camera tracks ended and we're supposed to be on, trigger recovery
            if(vTracks.length===0||(vTracks.length>0&&vTracks.every(t=>t.readyState==='ended'))){
                if(!camIsRecovering&&!camRecoveryTimer){
                    console.warn('[watchdog] Camera tracks ended — starting recovery');
                    startCamRecovery();
                }
            }
        }

        // 3. Fix own video if screen-sharing but tile shows nothing
        if(screenOn && localStream){
            const vTracks=localStream.getVideoTracks();
            if(vTracks.length>0&&vTracks.every(t=>t.readyState==='ended')){
                // Screen share died unexpectedly
                stopScreenShare();
            }
        }

        // 4. Repair dead senders in peer connections
        if(peer && localStream){
            const vTrack=localStream.getVideoTracks().find(t=>t.enabled&&t.readyState==='live');
            const aTrack=localStream.getAudioTracks().find(t=>t.readyState==='live');
            Object.values(peer.connections).forEach(arr=>{
                if(!Array.isArray(arr)) return;
                arr.forEach(conn=>{
                    if(conn.type!=='media'||!conn.peerConnection) return;
                    const pc=conn.peerConnection;
                    const senders=pc.getSenders();
                    senders.forEach(s=>{
                        if(s.track&&s.track.readyState==='ended'){
                            const replacement=s.track.kind==='video'?vTrack:aTrack;
                            if(replacement) s.replaceTrack(replacement).catch(()=>{});
                        }
                    });
                });
            });
        }

        // 5. Ensure audio is playing for all remote participants
        Object.entries(participants).forEach(([id,p])=>{
            if(id===myPeerId||!p.stream) return;
            ensureAudioPlaying(p.stream,id);
        });
    }, 2000);
}

function stopVideoWatchdog(){
    if(videoWatchdogTimer){clearInterval(videoWatchdogTimer);videoWatchdogTimer=null;}
}

// ─────────────────────────────────────────────
// HEARTBEAT
// ─────────────────────────────────────────────
function startHeartbeat(){
    stopHeartbeat();
    if(isHost){
        heartbeatSendTimer=setInterval(()=>{
            const now=Date.now();
            Object.values(connections).forEach(c=>{if(c.conn?.open) try{c.conn.send({type:'ping',ts:now});}catch(e){}});
            Object.entries(connections).forEach(([gid,c])=>{if(c.lastPing&&now-c.lastPing>HEARTBEAT_TIMEOUT){console.warn('Guest timed out:',gid);removeGuest(gid);}});
        },HEARTBEAT_INTERVAL);
    }else{
        hostLastPing=Date.now();
        heartbeatCheckTimer=setInterval(()=>{if(Date.now()-hostLastPing>HEARTBEAT_TIMEOUT){stopHeartbeat();scheduleTakeover();}},HEARTBEAT_INTERVAL);
    }
}
function stopHeartbeat(){clearInterval(heartbeatSendTimer);clearInterval(heartbeatCheckTimer);heartbeatSendTimer=null;heartbeatCheckTimer=null;}
function scheduleTakeover(){if(takeoverTimer)return;takeoverTimer=setTimeout(()=>{takeoverTimer=null;if(qs('app').style.display!=='none')tryBecomeHost();},randomTakeoverDelay());}
function cancelTakeover(){if(takeoverTimer){clearTimeout(takeoverTimer);takeoverTimer=null;}}

// ─────────────────────────────────────────────
// HOST
// ─────────────────────────────────────────────
function tryBecomeHost(){
    cancelTakeover();stopHeartbeat();
    if(peer){try{peer.destroy();}catch(e){}peer=null;}
    peer=new Peer(HOST_ID,PEER_CFG);
    peer.on('open',()=>{
        isHost=true;myPeerId=HOST_ID;
        participants={};
        participants[myPeerId]={name:myName,pic:myPicUrl,stream:localStream,muted:!micOn,hasVideo:false,isScreenSharing:false};
        renderAll();
        peer.on('connection',onGuestConn);
        peer.on('call',onGuestCall);
        startHeartbeat();
    });
    peer.on('error',err=>{if(err.type==='unavailable-id'){peer.destroy();peer=null;joinAsGuest();}else console.error('host peer err',err);});
}

// ─────────────────────────────────────────────
// GUEST
// ─────────────────────────────────────────────
function joinAsGuest(){
    cancelTakeover();stopHeartbeat();
    if(peer){try{peer.destroy();}catch(e){}peer=null;}
    const gid='g-'+Date.now()+'-'+Math.random().toString(36).substr(2,5);
    peer=new Peer(gid,PEER_CFG);
    peer.on('open',id=>{
        isHost=false;myPeerId=id;
        participants={};
        participants[myPeerId]={name:myName,pic:myPicUrl,stream:localStream,muted:!micOn,hasVideo:false,isScreenSharing:false};
        connections={};hostConn=null;
        renderAll();
        hostConn=peer.connect(HOST_ID,{metadata:{name:myName,pic:myPicUrl,id:myPeerId}});
        hostConn.on('open',()=>{
            cancelTakeover();startHeartbeat();
            const call=peer.call(HOST_ID,localStream,{metadata:{name:myName,pic:myPicUrl,id:myPeerId}});
            call.on('stream',remoteStream=>{
                ensureAudioPlaying(remoteStream,HOST_ID);
                upsertParticipant(HOST_ID,participants[HOST_ID]?.name||'Host',participants[HOST_ID]?.pic||PICS[0],remoteStream,false,participants[HOST_ID]?.hasVideo||false,participants[HOST_ID]?.isScreenSharing||false);
            });
            call.on('error',e=>console.error('call-to-host err',e));
        });
        hostConn.on('data',handleDataFromHost);
        hostConn.on('close',()=>{stopHeartbeat();scheduleTakeover();});
        hostConn.on('error',e=>console.error('hostConn err',e));
        peer.on('call',incomingCall=>{
            const meta=incomingCall.metadata||{};
            if(!meta.relay){incomingCall.close();return;}
            incomingCall.answer(localStream);
            incomingCall.on('stream',remoteStream=>{
                ensureAudioPlaying(remoteStream,meta.sourceId);
                upsertParticipant(meta.sourceId,meta.sourceName,meta.sourcePic,remoteStream,false,participants[meta.sourceId]?.hasVideo||false,participants[meta.sourceId]?.isScreenSharing||false);
            });
            incomingCall.on('close',()=>{delete participants[meta.sourceId];renderAll();});
            incomingCall.on('error',e=>console.error('relay-in err',e));
        });
    });
    peer.on('error',err=>{console.error('guest peer err',err.type);if(err.type==='peer-unavailable')setTimeout(tryBecomeHost,randomTakeoverDelay());});
    peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
}

// ─────────────────────────────────────────────
// AUDIO — echo-safe: video elements always muted
// ─────────────────────────────────────────────
const audioElements={};
function ensureAudioPlaying(stream,peerId){
    if(!stream||!peerId||peerId===myPeerId) return;
    if(!audioElements[peerId]){
        const aud=document.createElement('audio');
        aud.autoplay=true;aud.playsInline=true;aud.muted=false;
        aud.style.display='none';
        document.body.appendChild(aud);
        audioElements[peerId]=aud;
    }
    const aud=audioElements[peerId];
    if(aud.srcObject!==stream){
        aud.srcObject=stream;
        aud.play().catch(()=>{
            const unlock=()=>{aud.play().catch(()=>{});document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock);};
            document.addEventListener('click',unlock,{once:true});
            document.addEventListener('touchstart',unlock,{once:true});
        });
    }
}
function cleanupAudioElement(peerId){if(audioElements[peerId]){audioElements[peerId].srcObject=null;audioElements[peerId].remove();delete audioElements[peerId];}}

// ─────────────────────────────────────────────
// HOST connection handlers
// ─────────────────────────────────────────────
function onGuestConn(conn){
    const gid=conn.peer,meta=conn.metadata||{};
    if(!connections[gid]) connections[gid]={};
    connections[gid].conn=conn;connections[gid].name=meta.name||'Guest';connections[gid].pic=meta.pic||PICS[0];connections[gid].lastPing=Date.now();
    upsertParticipant(gid,meta.name,meta.pic,null,false,false,false);
    conn.on('open',()=>{
        const list=Object.entries(participants).map(([id,p])=>({id,name:p.name,pic:p.pic,muted:p.muted,hasVideo:p.hasVideo,isScreenSharing:p.isScreenSharing||false}));
        conn.send({type:'init',participants:list});
        broadcastExcept({type:'joined',participant:{id:gid,name:meta.name,pic:meta.pic}},gid);
        addSysMsg(`${meta.name} joined`);
    });
    conn.on('data',d=>handleDataFromGuest(gid,d));
    conn.on('close',()=>removeGuest(gid));
    conn.on('error',e=>console.error('guest conn err',e));
}
function onGuestCall(call){
    const gid=call.peer,meta=call.metadata||{};
    if(!connections[gid]) connections[gid]={};
    connections[gid].call=call;
    call.answer(localStream);
    call.on('stream',guestStream=>{
        const name=meta.name||connections[gid]?.name||'Guest';
        const pic=meta.pic||connections[gid]?.pic||PICS[0];
        connections[gid].stream=guestStream;connections[gid].name=name;connections[gid].pic=pic;
        ensureAudioPlaying(guestStream,gid);
        upsertParticipant(gid,name,pic,guestStream,false,participants[gid]?.hasVideo||false,participants[gid]?.isScreenSharing||false);
        Object.entries(connections).forEach(([oid,other])=>{if(oid===gid||!other.conn?.open)return;relayTo(oid,gid,name,pic,guestStream);});
        Object.entries(connections).forEach(([oid,other])=>{if(oid===gid||!other.stream)return;relayTo(gid,oid,other.name,other.pic,other.stream);});
    });
    call.on('close',()=>{if(participants[gid]){participants[gid].stream=null;participants[gid].hasVideo=false;participants[gid].isScreenSharing=false;}renderAll();});
    call.on('error',e=>console.error('guest call err',e));
}
function relayTo(targetId,sourceId,sourceName,sourcePic,sourceStream){
    if(!connections[targetId]?.conn?.open) return;
    const rc=peer.call(targetId,sourceStream,{metadata:{relay:true,sourceId,sourceName,sourcePic}});
    if(!connections[sourceId]) connections[sourceId]={};
    if(!connections[sourceId].relays) connections[sourceId].relays={};
    connections[sourceId].relays[targetId]=rc;
    rc.on('error',e=>console.error('relay err',e));
}
function handleDataFromGuest(sid,d){
    switch(d.type){
        case 'ping': if(connections[sid]?.conn?.open) try{connections[sid].conn.send({type:'pong',ts:d.ts});}catch(e){} break;
        case 'pong': if(connections[sid]) connections[sid].lastPing=Date.now(); break;
        case 'mute-status': if(participants[sid]) participants[sid].muted=d.muted; renderAll(); broadcastExcept({type:'mute-status',id:sid,muted:d.muted},sid); break;
        case 'cam-status':  if(participants[sid]) participants[sid].hasVideo=d.hasVideo; renderAll(); broadcastExcept({type:'cam-status',id:sid,hasVideo:d.hasVideo},sid); break;
        case 'screen-status': if(participants[sid]) participants[sid].isScreenSharing=d.isScreenSharing; renderAll(); broadcastExcept({type:'screen-status',id:sid,isScreenSharing:d.isScreenSharing},sid); break;
        case 'chat': broadcastAll({type:'chat',name:d.name,text:d.text,time:d.time}); addMsg(d.name,d.text,d.time,false); break;
        case 'fun-effect': broadcastAll({type:'fun-effect',effect:d.effect,senderName:d.senderName}); applyFunEffect(d.effect,d.senderName); break;
    }
}
function handleDataFromHost(d){
    switch(d.type){
        case 'ping': hostLastPing=Date.now(); if(hostConn?.open) try{hostConn.send({type:'pong',ts:d.ts});}catch(e){} break;
        case 'pong': hostLastPing=Date.now(); break;
        case 'init': d.participants.forEach(p=>{if(p.id!==myPeerId) upsertParticipant(p.id,p.name,p.pic,null,p.muted,p.hasVideo,p.isScreenSharing||false);}); break;
        case 'joined': if(d.participant.id!==myPeerId){upsertParticipant(d.participant.id,d.participant.name,d.participant.pic,null,false,false,false);addSysMsg(`${d.participant.name} joined`);} break;
        case 'left': if(d.id!==myPeerId){delete participants[d.id];cleanupAudioElement(d.id);renderAll();addSysMsg(`${d.name} left`);} break;
        case 'mute-status': if(participants[d.id]) participants[d.id].muted=d.muted; renderAll(); break;
        case 'cam-status':  if(participants[d.id]) participants[d.id].hasVideo=d.hasVideo; renderAll(); break;
        case 'screen-status': if(participants[d.id]) participants[d.id].isScreenSharing=d.isScreenSharing; renderAll(); break;
        case 'chat': if(d.name!==myName) addMsg(d.name,d.text,d.time,false); break;
        case 'fun-effect': applyFunEffect(d.effect,d.senderName); break;
    }
}
function broadcastAll(data){Object.values(connections).forEach(c=>{if(c.conn?.open) try{c.conn.send(data);}catch(e){}});}
function broadcastExcept(data,skip){Object.entries(connections).forEach(([id,c])=>{if(id===skip)return;if(c.conn?.open) try{c.conn.send(data);}catch(e){}});}
function removeGuest(gid){
    const name=participants[gid]?.name||'Someone';
    if(connections[gid]?.relays) Object.values(connections[gid].relays).forEach(r=>{try{r.close();}catch(e){}});
    cleanupAudioElement(gid);
    delete participants[gid];delete connections[gid];
    renderAll();broadcastAll({type:'left',id:gid,name});addSysMsg(`${name} left`);
}
function upsertParticipant(id,name,pic,stream,muted,hasVideo,isScreenSharing){
    if(!participants[id]) participants[id]={name,pic,stream,muted,hasVideo,isScreenSharing:isScreenSharing||false};
    else{if(name) participants[id].name=name;if(pic) participants[id].pic=pic;if(stream!==null) participants[id].stream=stream;participants[id].muted=muted;participants[id].hasVideo=hasVideo;if(isScreenSharing!==undefined) participants[id].isScreenSharing=isScreenSharing;}
    if(id!==myPeerId&&participants[id].stream) ensureAudioPlaying(participants[id].stream,id);
    renderAll();
}

// ─────────────────────────────────────────────
// CONFETTI ENGINE
// ─────────────────────────────────────────────
const confettiColors=['#f94144','#f3722c','#f8961e','#f9c74f','#90be6d','#43aa8b','#577590','#e63946','#a8dadc','#457b9d','#e9c46a','#f4a261'];

function launchConfettiOnTile(tile){
    // Remove existing canvas if any
    const existing=tile.querySelector('.confetti-canvas');
    if(existing) existing.remove();

    const canvas=document.createElement('canvas');
    canvas.className='confetti-canvas';
    canvas.width=tile.offsetWidth||300;
    canvas.height=tile.offsetHeight||200;
    tile.appendChild(canvas);

    const ctx=canvas.getContext('2d');
    const particles=[];
    const COUNT=60;

    for(let i=0;i<COUNT;i++){
        particles.push({
            x: canvas.width*(0.1+Math.random()*0.8),
            y: canvas.height+10,
            vx: (Math.random()-0.5)*6,
            vy: -(6+Math.random()*8),
            rot: Math.random()*360,
            rotV: (Math.random()-0.5)*12,
            w: 7+Math.random()*7,
            h: 4+Math.random()*4,
            color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
            shape: Math.random()<0.5?'rect':'circle',
            gravity: 0.25+Math.random()*0.15,
            alpha: 1
        });
    }

    let frame=0;
    const MAX_FRAMES=140;

    function animate(){
        if(frame>=MAX_FRAMES){canvas.remove();return;}
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p=>{
            p.x+=p.vx;
            p.y+=p.vy;
            p.vy+=p.gravity;
            p.vx*=0.99;
            p.rot+=p.rotV;
            if(frame>MAX_FRAMES*0.6) p.alpha=Math.max(0,p.alpha-0.025);
            ctx.save();
            ctx.globalAlpha=p.alpha;
            ctx.translate(p.x,p.y);
            ctx.rotate(p.rot*Math.PI/180);
            ctx.fillStyle=p.color;
            if(p.shape==='circle'){
                ctx.beginPath();ctx.arc(0,0,p.w/2,0,Math.PI*2);ctx.fill();
            }else{
                ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
            }
            ctx.restore();
        });
        frame++;
        requestAnimationFrame(animate);
    }
    animate();
}

function launchConfettiOnAllTiles(){
    document.querySelectorAll('.vtile').forEach(tile=>launchConfettiOnTile(tile));
}

// ─────────────────────────────────────────────
// GRID LAYOUT

function applyGridLayout(grid,n){
    const mob=window.innerWidth<=700;
    grid.style.gridTemplateAreas='';
    if(n===0) return;
    if(n===1){grid.style.gridTemplateColumns='1fr';grid.style.gridTemplateRows='1fr';return;}
    if(n===2){if(mob){grid.style.gridTemplateColumns='1fr';grid.style.gridTemplateRows='1fr 1fr';}else{grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='1fr';}return;}
    if(n===3){if(mob){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='3fr 2fr';grid.style.gridTemplateAreas='"a a" "b c"';}else{grid.style.gridTemplateColumns='13fr 7fr';grid.style.gridTemplateRows='1fr 1fr';grid.style.gridTemplateAreas='"a b" "a c"';}return;}
    if(n===4){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='1fr 1fr';return;}
    if(n===5){if(mob){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='2fr 1fr 1fr';grid.style.gridTemplateAreas='"a a" "b c" "d e"';}else{grid.style.gridTemplateColumns='3fr 2fr 2fr';grid.style.gridTemplateRows='1fr 1fr';grid.style.gridTemplateAreas='"a b c" "a d e"';}return;}
    if(n===6){if(mob){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='1fr 1fr 1fr';}else{grid.style.gridTemplateColumns='1fr 1fr 1fr';grid.style.gridTemplateRows='1fr 1fr';}return;}
    if(n===7||n===8){if(mob){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows=`repeat(${Math.ceil(n/2)},1fr)`;}else{grid.style.gridTemplateColumns='2fr 1fr 1fr';grid.style.gridTemplateRows='1fr 1fr 1fr';const o=['b','c','d','e','f','g','h'].slice(0,n-1);grid.style.gridTemplateAreas=`"a ${o.slice(0,2).join(' ')}" "a ${o.slice(2,4).join(' ')}" "a ${o.slice(4,6).join(' ')}"`;} return;}
    if(n<=9){grid.style.gridTemplateColumns='1fr 1fr 1fr';grid.style.gridTemplateRows='1fr 1fr 1fr';return;}
    if(n<=12){grid.style.gridTemplateColumns='1fr 1fr 1fr 1fr';grid.style.gridTemplateRows=`repeat(${Math.ceil(n/4)},1fr)`;return;}
    const cols=Math.ceil(Math.sqrt(n));
    grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    grid.style.gridTemplateRows=`repeat(${Math.ceil(n/cols)},1fr)`;
}

function renderAll(){
    const grid=qs('videoGrid'),plist=qs('peopleList'),dplist=qs('drawerPeopleList');
    grid.innerHTML='';plist.innerHTML='';dplist.innerHTML='';
    const ids=Object.keys(participants),n=ids.length;
    qs('onlineCount').textContent=n;
    pushOnlineCount();
    if(n===0){
        grid.style.gridTemplateColumns='1fr';grid.style.gridTemplateRows='1fr';grid.style.gridTemplateAreas='';
        grid.innerHTML='<div style="color:#555;text-align:center;padding:40px;display:flex;align-items:center;justify-content:center;grid-column:1/-1;">Waiting for others to join...</div>';
        return;
    }
    const ordered=[myPeerId,...ids.filter(id=>id!==myPeerId)];
    const useSpotlight=n>=3&&n<=8;
    const areaLetters=['a','b','c','d','e','f','g','h'];
    applyGridLayout(grid,n);
    const hasAreas=!!(grid.style.gridTemplateAreas&&grid.style.gridTemplateAreas!=='none'&&grid.style.gridTemplateAreas!=='');

    ordered.forEach((id,idx)=>{
        const p=participants[id];if(!p) return;
        const isMe=(id===myPeerId);
        const isSpotlight=isMe&&useSpotlight&&hasAreas;
        const isSharing=isMe?screenOn:(p.isScreenSharing||false);

        const tile=document.createElement('div');
        tile.className='vtile'+(isSpotlight?' spotlight':'')+(isSharing?' screensharing':'');
        tile.dataset.peerId=id;
        if(hasAreas&&idx<areaLetters.length) tile.style.gridArea=areaLetters[idx];

        let showVid=false;
        if(isMe){
            showVid=(camOn||screenOn)&&localStream!=null&&localStream.getVideoTracks().some(t=>t.enabled&&t.readyState==='live');
        }else{
            showVid=p.hasVideo&&p.stream!=null&&p.stream.getVideoTracks().some(t=>t.readyState!=='ended');
        }

        if(showVid){
            const vid=document.createElement('video');
            vid.autoplay=true;vid.playsInline=true;
            vid.muted=true;
            vid.srcObject=isMe?localStream:p.stream;
            vid.onloadedmetadata=()=>vid.play().catch(()=>{});
            tile.appendChild(vid);
            if(!isMe&&p.stream) ensureAudioPlaying(p.stream,id);
        }else{
            const ov=document.createElement('div');ov.className='av-overlay';
            const img=document.createElement('img');
            img.src=isMe?myPicUrl:(p.pic||PICS[0]);
            img.onerror=()=>img.src=PICS[0];
            const nm=document.createElement('span');nm.textContent=p.name+(isMe?' (you)':'');
            ov.append(img,nm);tile.appendChild(ov);
            if(!isMe&&p.stream) ensureAudioPlaying(p.stream,id);
        }

        // Screen badge
        const sb=document.createElement('div');
        sb.className='screen-badge'+(isSharing?' show':'');
        sb.textContent='Screen';
        tile.appendChild(sb);

        // Name label
        const lbl=document.createElement('div');lbl.className='name-label';
        const limg=document.createElement('img');
        limg.src=isMe?myPicUrl:(p.pic||PICS[0]);limg.onerror=()=>limg.src=PICS[0];
        lbl.append(limg,document.createTextNode(p.name+(isMe?' (you)':'')));
        tile.appendChild(lbl);

        // Mute icon
        const mb=document.createElement('div');
        mb.className='mute-icon'+(p.muted?' show':'');
        mb.textContent='🔇';
        tile.appendChild(mb);

        // Cam recovering indicator (only for self)
        if(isMe){
            const rec=document.createElement('div');
            rec.className='cam-recovering'+(camIsRecovering?' show':'');
            rec.innerHTML='<span class="spin-icon">↻</span> Reconnecting...';
            tile.appendChild(rec);
        }

        // Zoom button
        const zb=document.createElement('button');
        zb.className='zoom-btn';
        zb.title='View fullscreen';
        zb.innerHTML='⛶';
        if(p.muted) zb.classList.add('muted-shift');
        zb.onclick=(e)=>{e.stopPropagation();openTileFs(id);};
        tile.appendChild(zb);

        grid.appendChild(tile);

        // People list
        function makePerson(){
            const pi=document.createElement('div');pi.className='person';
            const pimg=document.createElement('img');
            pimg.src=isMe?myPicUrl:(p.pic||PICS[0]);pimg.onerror=()=>pimg.src=PICS[0];
            const pn=document.createElement('span');pn.className='person-name';
            pn.textContent=p.name+(isMe?' (you)':'')+(isSharing?' [Screen]':'');
            pi.append(pimg,pn);return pi;
        }
        plist.appendChild(makePerson());
        dplist.appendChild(makePerson());
    });

    if(tileFsPeerId && participants[tileFsPeerId]){
        openTileFs(tileFsPeerId);
    }
}

const EFFECTS={
    '/confetti':    {type:'confetti', label:'Confetti launched'},
    '/barrelroll':  {cls:'barrel-rolling', dur:700,  label:'Barrel roll'},
    '/spring':      {cls:'spring-bouncing',dur:850,  label:'Boing'},
};

// CSS animations injected once
(function injectAnimCSS(){
    const s=document.createElement('style');
    s.textContent=`
    @keyframes barrel-roll{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .barrel-rolling{animation:barrel-roll 0.7s ease-in-out !important;}
    @keyframes spring-compress{
        0%{transform:scaleY(1) scaleX(1)}
        30%{transform:scaleY(0.45) scaleX(1.4) translateY(15%)}
        60%{transform:scaleY(1.15) scaleX(0.9) translateY(-3%)}
        80%{transform:scaleY(0.95) scaleX(1.03)}
        100%{transform:scaleY(1) scaleX(1)}
    }
    .spring-bouncing{animation:spring-compress 0.85s cubic-bezier(0.36,0.07,0.19,0.97) !important;}
    `;
    document.head.appendChild(s);
})();

function applyFunEffect(cmd,senderName){
    const ef=EFFECTS[cmd]; if(!ef) return;
    addCmdMsg(`${senderName} used ${cmd}`);
    if(ef.type==='confetti'){
        launchConfettiOnAllTiles();
        return;
    }
    const tiles=document.querySelectorAll('.vtile');
    tiles.forEach(tile=>{
        tile.classList.remove(ef.cls);
        void tile.offsetWidth;
        tile.classList.add(ef.cls);
        setTimeout(()=>tile.classList.remove(ef.cls), ef.dur);
    });
}

function sendFunEffect(cmd){
    const ef=EFFECTS[cmd]; if(!ef) return;
    applyFunEffect(cmd,myName);
    const pkt={type:'fun-effect',effect:cmd,senderName:myName};
    if(isHost) broadcastAll(pkt);
    else if(hostConn?.open) hostConn.send(pkt);
}

    }
    const c1=qs('chatMsgs');c1.appendChild(make());c1.scrollTop=c1.scrollHeight;
    const c2=qs('drawerChatMsgs');c2.appendChild(make());c2.scrollTop=c2.scrollHeight;
}
function addSysMsg(text){
    function make(){const d=document.createElement('div');d.className='msg sys';d.innerHTML=`<div class="msg-body">— ${esc(text)}</div>`;return d;}
    const c1=qs('chatMsgs');c1.appendChild(make());c1.scrollTop=c1.scrollHeight;
    const c2=qs('drawerChatMsgs');c2.appendChild(make());c2.scrollTop=c2.scrollHeight;
}
function addCmdMsg(text){
    function make(){const d=document.createElement('div');d.className='msg cmd';d.innerHTML=`<div class="msg-body">${esc(text)}</div>`;return d;}
    const c1=qs('chatMsgs');c1.appendChild(make());c1.scrollTop=c1.scrollHeight;
    const c2=qs('drawerChatMsgs');c2.appendChild(make());c2.scrollTop=c2.scrollHeight;

function sendChat(){
    const mob=window.innerWidth<=700;
    const inp=mob?qs('drawerChatIn'):qs('chatIn');
    const text=inp.value.trim();if(!text) return;
    inp.value='';
    const cmd=text.trim().toLowerCase();
    if(EFFECTS[cmd]){sendFunEffect(cmd);return;}
    const time=hhmm();
    addMsg(myName,text,time,true);
    const pkt={type:'chat',name:myName,text,time};
    if(isHost) broadcastAll(pkt);
    else if(hostConn?.open) hostConn.send(pkt);
}
qs('chatIn').onkeypress=e=>{if(e.key==='Enter')sendChat();};
qs('sendBtn').onclick=sendChat;
qs('drawerChatIn').onkeypress=e=>{if(e.key==='Enter')sendChat();};
qs('drawerSendBtn').onclick=sendChat;

// ─────────────────────────────────────────────
// REPLACE TRACK IN PEERS
// ─────────────────────────────────────────────
function replaceTrackInPeers(newTrack,kind){
    if(!peer||!newTrack) return;
    Object.values(peer.connections).forEach(arr=>{
        if(!Array.isArray(arr)) return;
        arr.forEach(conn=>{
            if(conn.type==='media'&&conn.peerConnection){
                const s=conn.peerConnection.getSenders().find(s=>s.track&&s.track.kind===kind);
                if(s) s.replaceTrack(newTrack).catch(e=>console.warn('replaceTrack',e));
            }
        });
    });
}

// ─────────────────────────────────────────────
// MIC TOGGLE
// ─────────────────────────────────────────────
function toggleMic(){
    micOn=!micOn;
    if(mixedAudioTrack&&audioCtx&&micSource?._gainNode){
        micSource._gainNode.gain.value=micOn?1:0;
    }else{
        localStream.getAudioTracks().forEach(t=>{if(!t._isMixedAudio)t.enabled=micOn;});
    }
    if(participants[myPeerId]) participants[myPeerId].muted=!micOn;
    renderAll();updateCtrlBtns();
    const pkt={type:'mute-status',muted:!micOn};
    if(isHost) broadcastAll({...pkt,id:HOST_ID});
    else if(hostConn?.open) hostConn.send(pkt);
}

// ─────────────────────────────────────────────
// CAMERA TOGGLE
// ─────────────────────────────────────────────
async function toggleCam(){
    if(screenOn){toast('Stop screen sharing first');return;}
    if(!hasVideoPermission){toast('Camera not available');return;}

    if(!camOn){
        // Turning camera ON
        stopCamRecovery();
        const vTracks=localStream?localStream.getVideoTracks():[];
        const needNewTrack=vTracks.length===0||vTracks.every(t=>t.readyState==='ended');
        if(needNewTrack){
            try{
                let s;
                try{s=await navigator.mediaDevices.getUserMedia({video:isMobile?{facingMode:'user'}:true,audio:false});}
                catch(e){s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
                const t=s.getVideoTracks()[0];
                if(!t) throw new Error('no video track');
                localStream.getVideoTracks().forEach(old=>{localStream.removeTrack(old);old.stop();});
                localStream.addTrack(t);t.enabled=true;
                replaceTrackInPeers(t,'video');
                setTimeout(()=>replaceTrackInPeers(t,'video'),400);
                camOn=true;
            }catch(e){toast('Camera error: '+e.message);return;}
        }else{
            vTracks.forEach(t=>{t.enabled=true;});
            const t=vTracks.find(t=>t.readyState==='live');
            if(t){replaceTrackInPeers(t,'video');setTimeout(()=>replaceTrackInPeers(t,'video'),400);}
            camOn=true;
        }
    }else{
        // Turning camera OFF
        stopCamRecovery();
        camOn=false;
        localStream.getVideoTracks().forEach(t=>{t.enabled=false;});
    }

    if(participants[myPeerId]){participants[myPeerId].hasVideo=camOn;participants[myPeerId].stream=localStream;}
    renderAll();updateCtrlBtns();
    const pkt={type:'cam-status',hasVideo:camOn};
    if(isHost) broadcastAll({...pkt,id:HOST_ID});
    else if(hostConn?.open) hostConn.send(pkt);
}

// ─────────────────────────────────────────────
// SCREEN SHARE
// ─────────────────────────────────────────────
function createAudioMixer(micTrack,screenAudioTrack){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    audioMixer=audioCtx.createMediaStreamDestination();
    const micStream=new MediaStream([micTrack]);
    micSource=audioCtx.createMediaStreamSource(micStream);
    const micGain=audioCtx.createGain();micGain.gain.value=micOn?1:0;
    micSource.connect(micGain);micGain.connect(audioMixer);micSource._gainNode=micGain;
    if(screenAudioTrack){
        const sas=new MediaStream([screenAudioTrack]);
        screenAudioSource=audioCtx.createMediaStreamSource(sas);
        const sg=audioCtx.createGain();sg.gain.value=1;
        screenAudioSource.connect(sg);sg.connect(audioMixer);
    }
    mixedAudioTrack=audioMixer.stream.getAudioTracks()[0];
    mixedAudioTrack._isMixedAudio=true;
    return mixedAudioTrack;
}
function teardownAudioMixer(){try{if(audioCtx)audioCtx.close();}catch(e){}audioCtx=null;audioMixer=null;micSource=null;screenAudioSource=null;mixedAudioTrack=null;}

async function toggleScreen(){
    if(!screenShareSupported){toast(isIOS?'Screen sharing not supported on iOS':'Screen sharing not supported');return;}
    screenOn?await stopScreenShare():await startScreenShare();
}
async function startScreenShare(){
    try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:{cursor:'always'},audio:{echoCancellation:false,noiseSuppression:false,sampleRate:44100}});}
    catch(e){if(e.name!=='NotAllowedError'&&e.name!=='AbortError')toast('Screen share error: '+e.message);screenStream=null;return;}
    screenOn=true;camWasOnBeforeScreen=camOn;
    const svt=screenStream.getVideoTracks()[0];
    const sat=screenStream.getAudioTracks()[0]||null;
    localStream.getVideoTracks().forEach(t=>{localStream.removeTrack(t);});
    localStream.addTrack(svt);
    const curMic=localStream.getAudioTracks().find(t=>!t._isMixedAudio);
    if(sat&&curMic){const m=createAudioMixer(curMic,sat);localStream.getAudioTracks().forEach(t=>localStream.removeTrack(t));localStream.addTrack(m);replaceTrackInPeers(m,'audio');}
    else if(sat){localStream.getAudioTracks().forEach(t=>localStream.removeTrack(t));localStream.addTrack(sat);replaceTrackInPeers(sat,'audio');}
    replaceTrackInPeers(svt,'video');
    setTimeout(()=>replaceTrackInPeers(svt,'video'),500);
    svt.onended=()=>{if(screenOn)stopScreenShare();};
    camOn=true;
    if(participants[myPeerId]){participants[myPeerId].hasVideo=true;participants[myPeerId].isScreenSharing=true;participants[myPeerId].stream=localStream;}
    renderAll();updateCtrlBtns();
    toast(sat?'Screen sharing ON (with audio)':'Screen sharing ON');
    broadcastScreenStatus(true);
}
async function stopScreenShare(){
    screenOn=false;
    if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;}
    teardownAudioMixer();
    localStream.getAudioTracks().forEach(t=>localStream.removeTrack(t));
    if(originalMicTrack&&originalMicTrack.readyState!=='ended'){
        localStream.addTrack(originalMicTrack);originalMicTrack.enabled=micOn;replaceTrackInPeers(originalMicTrack,'audio');
    }else{
        try{const fa=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});const nm=fa.getAudioTracks()[0];if(nm){originalMicTrack=nm;nm.enabled=micOn;localStream.addTrack(nm);replaceTrackInPeers(nm,'audio');}}catch(e){}
    }
    localStream.getVideoTracks().forEach(t=>localStream.removeTrack(t));
    if(hasVideoPermission){
        try{
            let fs;try{fs=await navigator.mediaDevices.getUserMedia({video:isMobile?{facingMode:'user'}:true,audio:false});}catch(e){fs=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
            const ct=fs.getVideoTracks()[0];
            if(ct){ct.enabled=camWasOnBeforeScreen;localStream.addTrack(ct);replaceTrackInPeers(ct,'video');setTimeout(()=>replaceTrackInPeers(ct,'video'),400);camOn=camWasOnBeforeScreen;}
            else camOn=false;
        }catch(e){camOn=false;}
    }else camOn=false;
    if(participants[myPeerId]){participants[myPeerId].hasVideo=camOn;participants[myPeerId].isScreenSharing=false;participants[myPeerId].stream=localStream;}
    renderAll();updateCtrlBtns();toast('Screen sharing OFF');broadcastScreenStatus(false);
    const pkt={type:'cam-status',hasVideo:camOn};if(isHost)broadcastAll({...pkt,id:HOST_ID});else if(hostConn?.open)hostConn.send(pkt);
}
function broadcastScreenStatus(v){const pkt={type:'screen-status',isScreenSharing:v};if(isHost)broadcastAll({...pkt,id:HOST_ID});else if(hostConn?.open)hostConn.send(pkt);}

// ─────────────────────────────────────────────
// CONTROLS UPDATE
// ─────────────────────────────────────────────
function updateCtrlBtns(){
    const m=qs('micBtn'),c=qs('camBtn'),s=qs('screenBtn');
    m.className='toggle-pill '+(micOn?'state-on':'state-off');
    qs('micState').textContent=micOn?'ON':'OFF';
    const ca=camOn&&!screenOn;
    c.className='toggle-pill '+(ca?'state-on':'state-off');
    qs('camState').textContent=ca?'ON':'OFF';
    if(!screenShareSupported){s.className='toggle-pill state-disabled';qs('screenState').textContent='N/A';}
    else if(screenOn){s.className='toggle-pill state-screen';qs('screenState').textContent='Stop';}
    else{s.className='toggle-pill state-off';qs('screenState').textContent='Share';}
}

// ─────────────────────────────────────────────
// EXIT
// ─────────────────────────────────────────────
async function exitCall(){
    closeTileFs();cancelTakeover();stopHeartbeat();stopVideoWatchdog();stopCamRecovery();
    if(screenOn){screenOn=false;if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;}teardownAudioMixer();}
    if(isHost){db.collection('room').doc('main').set({onlineCount:0},{merge:true}).catch(()=>{});Object.values(connections).forEach(c=>{try{c.call?.close();}catch(e){}try{c.conn?.close();}catch(e){}if(c.relays)Object.values(c.relays).forEach(r=>{try{r.close();}catch(e){}});});}
    else{try{hostConn?.close();}catch(e){}}
    Object.keys(audioElements).forEach(cleanupAudioElement);
    if(tileFsAudioEl){tileFsAudioEl.srcObject=null;tileFsAudioEl.remove();tileFsAudioEl=null;}
    if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
    originalMicTrack=null;
    try{peer?.destroy();}catch(e){}
    peer=null;hostConn=null;participants={};connections={};
    isHost=false;myPeerId='';micOn=true;camOn=false;hasVideoPermission=false;screenOn=false;screenStream=null;
    qs('chatMsgs').innerHTML='';qs('drawerChatMsgs').innerHTML='';
    qs('app').style.display='none';qs('authWrap').style.display='flex';
    updateCtrlBtns();
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

qs('micBtn').onclick=toggleMic;
qs('camBtn').onclick=toggleCam;
qs('screenBtn').onclick=toggleScreen;
qs('endBtn').onclick=exitCall;

// FULLSCREEN
// ─────────────────────────────────────────────
qs('fullscreenBtn').onclick=()=>{
    const el=qs('app');
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){const fn=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;if(fn)fn.call(el).catch(()=>{});}
    else{const fn=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;if(fn)fn.call(document).catch(()=>{});}
};
function onFsChange(){const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement);qs('fullscreenBtn').title=isFs?'Exit Fullscreen':'Fullscreen';}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
