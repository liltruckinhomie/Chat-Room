<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Homie Chat – Video & Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== AUTH ===== */
        .auth-container {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 18px 14px;
            width: 320px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .auth-btn {
            width:100%; padding:9px; margin:4px 0;
            background: linear-gradient(145deg,#1877f2,#1658d4);
            color:white; border:none; border-radius:6px;
            font-size:13px; font-weight:600; cursor:pointer;
        }
        .auth-btn:hover { opacity:0.9; }
        .form-input {
            width:100%; padding:8px; margin:5px 0;
            background:rgba(255,255,255,0.85);
            border:1px solid rgba(0,0,0,0.12);
            border-radius:5px; font-size:13px; outline:none;
        }
        .form-input:focus { border-color:#1877f2; }
        .error-msg { color:#ff4242; font-size:11px; min-height:14px; margin:2px 0; }
        .hidden { display:none !important; }
        .back-btn {
            position:absolute; top:10px; right:12px;
            background:none; border:none; color:#1877f2;
            font-size:18px; cursor:pointer; line-height:1;
        }
        .form-title { font-size:15px; margin:4px 0 12px; text-align:center; font-weight:600; color:#222; }
        .main-buttons { margin-top:8px; }

        .user-info { display:flex; align-items:center; gap:10px; margin:8px 0 14px; }
        .profile-picture {
            width:48px; height:48px; border-radius:50%;
            object-fit:cover; border:2px solid #1877f2; flex-shrink:0;
        }
        .welcome-text { font-size:18px; font-weight:600; color:#222; }
        .welcome-name { color:#1877f2; }
        .join-btn {
            width:100%; padding:10px; margin:4px 0;
            background: linear-gradient(145deg,#4285F4,#1a73e8);
            color:white; border:none; border-radius:6px;
            font-size:15px; font-weight:600; cursor:pointer;
        }
        .join-btn:hover { opacity:0.92; }
        .signout-btn {
            position:absolute; top:8px; right:8px;
            padding:5px 10px;
            background:rgba(255,0,0,0.08); color:#e03;
            border:1px solid rgba(255,0,0,0.18);
            border-radius:6px; font-size:11px; font-weight:600; cursor:pointer;
        }

        .join-online-pill {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25);
            color: #4ade80; padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600; margin-bottom: 10px;
        }
        .join-online-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #4ade80; animation: pulse 1.5s infinite;
        }

        .ban-box {
            background:rgba(255,0,0,0.08); border:1px solid rgba(255,0,0,0.25);
            border-radius:8px; padding:10px 12px; margin:8px 0;
            text-align:center; font-size:13px;
        }
        .ban-box .ban-name { font-weight:700; color:#c00; font-size:14px; margin-bottom:4px; }
        .ban-box .ban-detail { color:#555; font-size:12px; margin:2px 0; }

        /* ===== APP ===== */
        #app {
            display:none; width:100%; height:100%;
            flex-direction:column; background:#1a1a2e;
            position:fixed; top:0; left:0; right:0; bottom:0;
        }
        .topbar {
            background:#16213e; color:white;
            padding:10px 16px;
            display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid #2c3e66; flex-shrink:0;
        }
        .online-pill {
            background:#2c3e66; padding:4px 12px;
            border-radius:20px; font-size:12px;
        }
        .online-dot {
            display:inline-block; width:8px; height:8px;
            background:#4ade80; border-radius:50%;
            margin-right:5px; animation:pulse 1.5s infinite;
        }
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .top-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid #1877f2; }
        .top-name { color:white; font-size:13px; font-weight:600; }

        .topbar-right {
            display:flex; align-items:center; gap:10px;
        }
        .fullscreen-btn {
            background:rgba(255,255,255,0.08); border:none;
            width:32px; height:32px; border-radius:7px;
            color:#ccc; cursor:pointer; font-size:15px;
            display:flex; align-items:center; justify-content:center;
            transition:background 0.15s;
        }
        .fullscreen-btn:hover { background:rgba(255,255,255,0.16); }

        .app-body { display:flex; flex:1; overflow:hidden; min-height:0; }

        .video-grid {
            flex: 1;
            display: grid;
            gap: 6px;
            padding: 6px;
            background: #0a0a14;
            overflow: hidden;
            min-height: 0;
            min-width: 0;
            align-content: center;
            justify-content: center;
        }

        .vtile {
            position: relative;
            background: #1c1c2e;
            border-radius: 12px;
            overflow: hidden;
            min-height: 0;
            min-width: 0;
            border: 2px solid rgba(255,255,255,0.15);
        }

        .vtile.spotlight {
            border: 2px solid rgba(255,255,255,0.3);
        }

        .vtile.screensharing {
            border: 2px solid rgba(124,58,237,0.8);
            box-shadow: 0 0 14px rgba(124,58,237,0.35);
        }

        .vtile video {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            background: #0a0a14;
        }

        .vtile .av-overlay {
            position:absolute; inset:0;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background:#1c1c2e; gap:10px;
        }
        .vtile .av-overlay img {
            width:80px; height:80px; border-radius:50%;
            border:3px solid #1877f2; object-fit:cover;
        }
        .vtile .av-overlay span { color:#ccc; font-size:13px; font-weight:500; }

        .vtile.spotlight .av-overlay img { width:110px; height:110px; }
        .vtile.spotlight .av-overlay span { font-size:15px; }

        .vtile .name-label {
            position:absolute; bottom:8px; left:8px;
            background:rgba(0,0,0,0.7); padding:4px 10px;
            border-radius:20px; font-size:11px; color:white;
            display:flex; align-items:center; gap:5px; z-index:3;
            backdrop-filter: blur(4px);
        }
        .vtile .name-label img { width:18px; height:18px; border-radius:50%; }
        .vtile .mute-icon {
            position:absolute; top:8px; right:8px;
            background:rgba(220,38,38,0.85); width:26px; height:26px;
            border-radius:50%; display:none;
            align-items:center; justify-content:center;
            font-size:13px; z-index:3;
        }
        .vtile .mute-icon.show { display:flex; }

        .screen-badge {
            position:absolute; top:8px; left:8px;
            background:rgba(124,58,237,0.85);
            padding:3px 8px; border-radius:20px;
            font-size:10px; color:white; font-weight:700;
            letter-spacing:0.04em; z-index:3;
            display:none; align-items:center; gap:3px;
            backdrop-filter:blur(4px);
        }
        .screen-badge.show { display:flex; }

        .sidebar {
            width:300px; background:rgba(255,255,255,0.03);
            border-left:1px solid rgba(255,255,255,0.07);
            display:flex; flex-direction:column; flex-shrink:0;
        }
        .tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.07); }
        .tab { flex:1; padding:11px; text-align:center; color:#777; cursor:pointer; font-size:13px; }
        .tab.active { color:#60a5fa; border-bottom:2px solid #60a5fa; }
        .panel { display:none; flex:1; overflow:hidden; flex-direction:column; min-height:0; }
        .panel.active { display:flex; }
        .chat-msgs {
            flex:1; overflow-y:auto; padding:10px;
            display:flex; flex-direction:column; gap:6px;
        }
        .msg { display:flex; flex-direction:column; gap:3px; }
        .msg-head { display:flex; align-items:baseline; gap:7px; }
        .msg-name { font-size:11px; font-weight:600; color:#60a5fa; }
        .msg-name.me { color:#a78bfa; }
        .msg-time { font-size:10px; color:#444; }
        .msg-body {
            font-size:13px; color:#ddd;
            background:rgba(255,255,255,0.05);
            padding:7px 11px; border-radius:10px; word-break:break-word;
        }
        .msg.me .msg-body { background:rgba(96,165,250,0.15); }
        .msg.sys .msg-body { background:none; color:#555; font-style:italic; padding:3px 0; }
        .chat-input {
            padding:9px; border-top:1px solid rgba(255,255,255,0.07);
            display:flex; gap:7px;
        }
        .chat-input input {
            flex:1; padding:9px 12px;
            background:rgba(255,255,255,0.07);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:20px; color:white; font-size:13px; outline:none;
        }
        .chat-input button {
            width:34px; height:34px; background:#1877f2;
            border:none; border-radius:50%; color:white; cursor:pointer; font-size:16px;
        }
        .people-list { flex:1; overflow-y:auto; padding:9px; }
        .person {
            display:flex; align-items:center; gap:9px; padding:9px;
            background:rgba(255,255,255,0.05); border-radius:9px; margin-bottom:5px;
        }
        .person img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
        .person-name { flex:1; font-size:13px; color:#ddd; }

        /* ── CONTROLS ── */
        .controls {
            padding: 10px 20px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background:#16213e;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:16px;
            border-top:1px solid #2c3e66;
            flex-shrink:0;
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
        }
        .toggle-group {
            display:flex; flex-direction:column;
            align-items:center; gap:4px;
        }
        .toggle-label {
            font-size:10px; color:#888;
            font-weight:600; letter-spacing:0.05em; text-transform:uppercase;
        }
        .toggle-pill {
            width:82px; height:36px; border-radius:18px;
            border:none; cursor:pointer;
            font-size:12px; font-weight:700; letter-spacing:0.04em;
            transition:background 0.2s, box-shadow 0.2s;
            display:flex; align-items:center; justify-content:center; gap:5px;
            white-space:nowrap;
        }
        .toggle-pill.state-on {
            background:#1877f2; color:white;
            box-shadow:0 0 12px rgba(24,119,242,0.5);
        }
        .toggle-pill.state-off {
            background:rgba(255,255,255,0.08); color:#888; box-shadow:none;
        }
        .toggle-pill.state-screen {
            background: linear-gradient(135deg,#7c3aed,#4f46e5);
            color:white;
            box-shadow:0 0 14px rgba(124,58,237,0.55);
        }
        /* ── SVG icon inside pill ── */
        .toggle-pill svg {
            width: 14px; height: 14px;
            flex-shrink: 0;
            fill: currentColor;
        }
        .toggle-pill .pill-dot {
            width:8px; height:8px; border-radius:50%; transition:background 0.2s;
        }
        .toggle-pill.state-on .pill-dot { background:#7dd3fc; }
        .toggle-pill.state-off .pill-dot { background:#555; }
        .toggle-pill.state-screen .pill-dot { background:#c4b5fd; }

        .end-btn {
            width:48px; height:48px; border-radius:50%; border:none;
            background:#dc2626; color:white; font-size:20px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
        }
        .end-btn:hover { background:#b91c1c; }

        /* Screen share disabled on iOS */
        .toggle-pill.state-disabled {
            background:rgba(255,255,255,0.04); color:#444;
            cursor:not-allowed; box-shadow:none;
        }

        .toast {
            position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
            background:#222; color:white; padding:7px 16px;
            border-radius:30px; font-size:13px; opacity:0;
            transition:opacity .2s; pointer-events:none; z-index:9999;
            max-width: 90vw; text-align: center;
        }
        .toast.show { opacity:1; }

        .mobile-drawer-btn { display:none; }
        .mobile-drawer-overlay { display:none; }
        .mobile-drawer { display:none; }

        @media (max-width: 700px) {
            .sidebar { display:none !important; }
            .mobile-drawer-btn {
                display:flex; flex-direction:column;
                align-items:center; gap:4px;
            }
            .controls {
                padding: 8px 12px;
                padding-bottom: max(14px, env(safe-area-inset-bottom));
                gap:10px;
            }
            .toggle-pill { width:68px; height:34px; font-size:11px; }
            .end-btn { width:44px; height:44px; font-size:18px; }
            .mobile-drawer-overlay {
                display:block;
                position:fixed; inset:0;
                background:rgba(0,0,0,0.55);
                z-index:200;
                opacity:0; pointer-events:none;
                transition:opacity 0.22s;
            }
            .mobile-drawer-overlay.open { opacity:1; pointer-events:all; }
            .mobile-drawer {
                display:flex; flex-direction:column;
                position:fixed; bottom:0; left:0; right:0;
                height:72vh;
                background:#16213e;
                border-radius:18px 18px 0 0;
                border-top:1px solid #2c3e66;
                z-index:201;
                transform:translateY(100%);
                transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
                padding-bottom: env(safe-area-inset-bottom);
            }
            .mobile-drawer.open { transform:translateY(0); }
            .drawer-handle {
                width:38px; height:4px; background:#444;
                border-radius:2px; margin:10px auto 0; flex-shrink:0;
            }
            .drawer-close {
                position:absolute; top:10px; right:14px;
                background:none; border:none; color:#888;
                font-size:20px; cursor:pointer;
            }
            .drawer-tabs {
                display:flex; border-bottom:1px solid rgba(255,255,255,0.07);
                flex-shrink:0; margin-top:6px;
            }
            .drawer-tab {
                flex:1; padding:11px; text-align:center;
                color:#777; cursor:pointer; font-size:13px;
            }
            .drawer-tab.active { color:#60a5fa; border-bottom:2px solid #60a5fa; }
            .drawer-panel { display:none; flex:1; overflow:hidden; flex-direction:column; min-height:0; }
            .drawer-panel.active { display:flex; }
            .top-name { display:none; }
            .topbar { padding:8px 12px; }
        }
    </style>
</head>
<body>

<div id="authWrap">
    <div class="auth-container" id="authMain">
        <div id="banBox" class="ban-box hidden">
            <div class="ban-name" id="banName"></div>
            <div class="ban-detail" id="banReasonLine"></div>
            <div class="ban-detail" id="banUntilLine"></div>
        </div>
        <div id="authBtns" class="main-buttons">
            <button id="showSignup" class="auth-btn">Sign Up</button>
            <button id="showLogin"  class="auth-btn">Sign In</button>
        </div>
        <div id="userDisplay" class="hidden">
            <div class="user-info">
                <img id="profilePic" class="profile-picture"
                     src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png">
                <div>
                    <div class="welcome-text">Welcome, <span class="welcome-name" id="displayName"></span>!</div>
                </div>
            </div>
            <div class="join-online-pill" id="joinOnlinePill" style="display:none">

function parseBan(f){
    if(!f) return null;
    try{
        if(f.toLowerCase().includes('forever')) return {reason:f.split('/')[0],forever:true};
        const p=f.split('/');
        if(p.length===5){
            const fy=parseInt(p[4])<100?2000+parseInt(p[4]):parseInt(p[4]);
            return{reason:p[0],time:p[1],until:new Date(fy,parseInt(p[3])-1,parseInt(p[2]),parseInt(p[1].substring(0,2)),parseInt(p[1].substring(2,4))),forever:false};
        }
        if(p.length===4){
            const fy=parseInt(p[3])<100?2000+parseInt(p[3]):parseInt(p[3]);
            return{reason:p[0],until:new Date(fy,parseInt(p[2])-1,parseInt(p[1])),forever:false};
        }
    }catch(e){}
    return null;
}
function isBanned(f){ const b=parseBan(f); return b&&(b.forever||new Date()<b.until); }
function isBanExpired(f){ const b=parseBan(f); return b&&!b.forever&&new Date()>=b.until; }
function showBanUI(username,b){
    qs('banName').textContent=b.forever?`${username} is permanently banned`:`${username} has been banned`;
    qs('banReasonLine').textContent='Reason: '+b.reason;
    if(!b.forever&&b.until){
        const ds=b.until.toLocaleDateString('en-GB');
        const ts=b.time?` ${b.time.substring(0,2)}:${b.time.substring(2,4)}`:'';
        qs('banUntilLine').textContent='Until: '+ds+ts;
        qs('banUntilLine').classList.remove('hidden');

    qs('banBox').classList.remove('hidden');

    qs('loginPanel').classList.add('hidden');
    qs('authMain').style.display='block';
    qs('authBtns').classList.remove('hidden');
    qs('userDisplay').classList.add('hidden');
}

    const doc=await db.collection('users').doc(uid).get();

    }
    if(d.banned&&isBanned(d.banned)){showBanUI(username,parseBan(d.banned));await auth.signOut();return true;}
    hideBanUI(); return false;
}

}

async function initMedia(){

// ─────────────────────────────────────────────
// HEARTBEAT
// ─────────────────────────────────────────────
function startHeartbeat(){
    stopHeartbeat();
    if(isHost){
        heartbeatSendTimer=setInterval(()=>{
            const now=Date.now();
            Object.values(connections).forEach(c=>{
                if(c.conn&&c.conn.open) try{c.conn.send({type:'ping',ts:now});}catch(e){}
            });
            Object.entries(connections).forEach(([gid,c])=>{
                if(c.lastPing && now-c.lastPing > HEARTBEAT_TIMEOUT){
                    console.warn('Guest timed out:',gid);
                    removeGuest(gid);
                }
            });
        }, HEARTBEAT_INTERVAL);
    } else {
        hostLastPing=Date.now();
        heartbeatCheckTimer=setInterval(()=>{
            if(Date.now()-hostLastPing > HEARTBEAT_TIMEOUT){
                console.warn('Host timed out — attempting takeover');
                stopHeartbeat();
                scheduleTakeover();
            }
        }, HEARTBEAT_INTERVAL);
    }
}
function stopHeartbeat(){
    clearInterval(heartbeatSendTimer);
    clearInterval(heartbeatCheckTimer);
    heartbeatSendTimer=null;
    heartbeatCheckTimer=null;
}
function scheduleTakeover(){
    if(takeoverTimer) return;
    const delay=randomTakeoverDelay();
    takeoverTimer=setTimeout(()=>{
        takeoverTimer=null;
        if(qs('app').style.display!=='none') tryBecomeHost();
    },delay);
}
function cancelTakeover(){
    if(takeoverTimer){clearTimeout(takeoverTimer);takeoverTimer=null;}
}

// ─────────────────────────────────────────────
// HOST
// ─────────────────────────────────────────────
function tryBecomeHost(){
    cancelTakeover(); stopHeartbeat();
    if(peer){try{peer.destroy();}catch(e){}peer=null;}
    peer=new Peer(HOST_ID,PEER_CFG);
    peer.on('open',()=>{
        isHost=true; myPeerId=HOST_ID;
        participants={};
        participants[myPeerId]={name:myName,pic:myPicUrl,stream:localStream,muted:!micOn,hasVideo:false,isScreenSharing:false};
        renderAll();
        peer.on('connection',onGuestConn);
        peer.on('call',onGuestCall);
        startHeartbeat();
    });
    peer.on('error',err=>{
        if(err.type==='unavailable-id'){peer.destroy();peer=null;joinAsGuest();}
        else console.error('host peer err',err);
    });
}

// ─────────────────────────────────────────────
// GUEST
// ─────────────────────────────────────────────
function joinAsGuest(){
    cancelTakeover(); stopHeartbeat();
    if(peer){try{peer.destroy();}catch(e){}peer=null;}
    const gid='g-'+Date.now()+'-'+Math.random().toString(36).substr(2,5);
    peer=new Peer(gid,PEER_CFG);
    peer.on('open',id=>{
        isHost=false; myPeerId=id;
        participants={};
        participants[myPeerId]={name:myName,pic:myPicUrl,stream:localStream,muted:!micOn,hasVideo:false,isScreenSharing:false};
        connections={}; hostConn=null;
        renderAll();
        hostConn=peer.connect(HOST_ID,{metadata:{name:myName,pic:myPicUrl,id:myPeerId}});
        hostConn.on('open',()=>{
            cancelTakeover();
            startHeartbeat();
            const call=peer.call(HOST_ID,localStream,{metadata:{name:myName,pic:myPicUrl,id:myPeerId}});
            call.on('stream',remoteStream=>{
                ensureAudioPlaying(remoteStream,HOST_ID);
                const existingHasVideo=participants[HOST_ID]?.hasVideo||false;
                const existingScreen=participants[HOST_ID]?.isScreenSharing||false;
                upsertParticipant(HOST_ID,participants[HOST_ID]?.name||'Host',participants[HOST_ID]?.pic||PICS[0],remoteStream,false,existingHasVideo,existingScreen);
            });
            call.on('error',e=>console.error('call-to-host err',e));
        });
        hostConn.on('data',handleDataFromHost);
        hostConn.on('close',()=>{ stopHeartbeat(); scheduleTakeover(); });
        hostConn.on('error',e=>console.error('hostConn err',e));
        peer.on('call',incomingCall=>{
            const meta=incomingCall.metadata||{};
            if(!meta.relay){incomingCall.close();return;}
            incomingCall.answer(localStream);
            incomingCall.on('stream',remoteStream=>{
                ensureAudioPlaying(remoteStream,meta.sourceId);
                const existingHasVideo=participants[meta.sourceId]?.hasVideo||false;
                const existingScreen=participants[meta.sourceId]?.isScreenSharing||false;
                upsertParticipant(meta.sourceId,meta.sourceName,meta.sourcePic,remoteStream,false,existingHasVideo,existingScreen);
            });
            incomingCall.on('close',()=>{delete participants[meta.sourceId];renderAll();});
            incomingCall.on('error',e=>console.error('relay-in err',e));
        });
    });
    peer.on('error',err=>{
        console.error('guest peer err',err.type);
        if(err.type==='peer-unavailable') setTimeout(tryBecomeHost,randomTakeoverDelay());
    });
    peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
}

// ─────────────────────────────────────────────
// AUDIO ELEMENTS
// ─────────────────────────────────────────────
const audioElements = {};
function ensureAudioPlaying(stream,peerId){
    if(!stream||!peerId||peerId===myPeerId) return;
    if(!audioElements[peerId]){
        const aud=document.createElement('audio');
        aud.autoplay=true; aud.playsInline=true;
        aud.style.display='none';
        document.body.appendChild(aud);
        audioElements[peerId]=aud;
    }
    const aud=audioElements[peerId];
    if(aud.srcObject!==stream){
        aud.srcObject=stream;
        aud.play().catch(e=>console.warn('audio play blocked:',e));
    }
}
function cleanupAudioElement(peerId){
    if(audioElements[peerId]){
        audioElements[peerId].srcObject=null;
        audioElements[peerId].remove();
        delete audioElements[peerId];
    }
}

// ─────────────────────────────────────────────
// HOST — incoming data connection
// ─────────────────────────────────────────────
function onGuestConn(conn){
    const gid=conn.peer, meta=conn.metadata||{};
    if(!connections[gid]) connections[gid]={};
    connections[gid].conn=conn;
    connections[gid].name=meta.name||'Guest';
    connections[gid].pic=meta.pic||PICS[0];
    connections[gid].lastPing=Date.now();
    upsertParticipant(gid,meta.name,meta.pic,null,false,false,false);
    conn.on('open',()=>{
        const list=Object.entries(participants).map(([id,p])=>({
            id,name:p.name,pic:p.pic,muted:p.muted,hasVideo:p.hasVideo,isScreenSharing:p.isScreenSharing||false
        }));
        conn.send({type:'init',participants:list});
        broadcastExcept({type:'joined',participant:{id:gid,name:meta.name,pic:meta.pic}},gid);
        addSysMsg(`${meta.name} joined`);
    });
    conn.on('data',d=>handleDataFromGuest(gid,d));
    conn.on('close',()=>removeGuest(gid));
    conn.on('error',e=>console.error('guest conn err',e));
}

// ─────────────────────────────────────────────
// HOST — incoming media call from a guest
// ─────────────────────────────────────────────
function onGuestCall(call){
    const gid=call.peer, meta=call.metadata||{};
    if(!connections[gid]) connections[gid]={};
    connections[gid].call=call;
    call.answer(localStream);
    call.on('stream',guestStream=>{
        const name=meta.name||connections[gid]?.name||'Guest';
        const pic=meta.pic||connections[gid]?.pic||PICS[0];
        const hasVid=participants[gid]?.hasVideo||false;
        const isScreen=participants[gid]?.isScreenSharing||false;
        connections[gid].stream=guestStream;
        connections[gid].name=name;
        connections[gid].pic=pic;
        ensureAudioPlaying(guestStream,gid);
        upsertParticipant(gid,name,pic,guestStream,false,hasVid,isScreen);
        Object.entries(connections).forEach(([otherId,other])=>{
            if(otherId===gid) return;
            if(!other.conn||!other.conn.open) return;
            relayTo(otherId,gid,name,pic,guestStream);
        });
        Object.entries(connections).forEach(([otherId,other])=>{
            if(otherId===gid) return;
            if(!other.stream) return;
            relayTo(gid,otherId,other.name,other.pic,other.stream);
        });
    });
    call.on('close',()=>{
        if(participants[gid]){participants[gid].stream=null;participants[gid].hasVideo=false;participants[gid].isScreenSharing=false;}
        renderAll();
    });
    call.on('error',e=>console.error('guest call err',e));
}

// ─────────────────────────────────────────────
// HOST — relay helper
// ─────────────────────────────────────────────
function relayTo(targetId,sourceId,sourceName,sourcePic,sourceStream){
    if(!connections[targetId]?.conn?.open) return;
    const rc=peer.call(targetId,sourceStream,{metadata:{relay:true,sourceId,sourceName,sourcePic}});
    if(!connections[sourceId]) connections[sourceId]={};
    if(!connections[sourceId].relays) connections[sourceId].relays={};
    connections[sourceId].relays[targetId]=rc;
    rc.on('error',e=>console.error('relay err',e));
}

// ─────────────────────────────────────────────
// HOST — handle messages from a guest
// ─────────────────────────────────────────────
function handleDataFromGuest(sid,d){
    switch(d.type){
        case 'ping':
            if(connections[sid]?.conn?.open) try{connections[sid].conn.send({type:'pong',ts:d.ts});}catch(e){}
            break;
        case 'pong':
            if(connections[sid]) connections[sid].lastPing=Date.now();
            break;
        case 'mute-status':
            if(participants[sid]) participants[sid].muted=d.muted;
            renderAll();
            broadcastExcept({type:'mute-status',id:sid,muted:d.muted},sid);
            break;
        case 'cam-status':
            if(participants[sid]) participants[sid].hasVideo=d.hasVideo;
            renderAll();
            broadcastExcept({type:'cam-status',id:sid,hasVideo:d.hasVideo},sid);
            break;
        case 'screen-status':
            if(participants[sid]) participants[sid].isScreenSharing=d.isScreenSharing;
            renderAll();
            broadcastExcept({type:'screen-status',id:sid,isScreenSharing:d.isScreenSharing},sid);
            break;
        case 'chat':
            broadcastAll({type:'chat',name:d.name,text:d.text,time:d.time});
            addMsg(d.name,d.text,d.time,false);
            break;
    }
}

// ─────────────────────────────────────────────
// GUEST — handle messages from host
// ─────────────────────────────────────────────
function handleDataFromHost(d){
    switch(d.type){
        case 'ping':
            hostLastPing=Date.now();
            if(hostConn&&hostConn.open) try{hostConn.send({type:'pong',ts:d.ts});}catch(e){}
            break;
        case 'pong':
            hostLastPing=Date.now();
            break;
        case 'init':
            d.participants.forEach(p=>{
                if(p.id!==myPeerId)
                    upsertParticipant(p.id,p.name,p.pic,null,p.muted,p.hasVideo,p.isScreenSharing||false);
            });
            break;
        case 'joined':
            if(d.participant.id!==myPeerId){
                upsertParticipant(d.participant.id,d.participant.name,d.participant.pic,null,false,false,false);
                addSysMsg(`${d.participant.name} joined`);
            }
            break;
        case 'left':
            if(d.id!==myPeerId){
                delete participants[d.id];
                cleanupAudioElement(d.id);
                renderAll();
                addSysMsg(`${d.name} left`);
            }
            break;
        case 'mute-status':
            if(participants[d.id]) participants[d.id].muted=d.muted;
            renderAll(); break;
        case 'cam-status':
            if(participants[d.id]) participants[d.id].hasVideo=d.hasVideo;
            renderAll(); break;
        case 'screen-status':
            if(participants[d.id]) participants[d.id].isScreenSharing=d.isScreenSharing;
            renderAll(); break;
        case 'chat':
            if(d.name!==myName) addMsg(d.name,d.text,d.time,false);
            break;
    }
}

// ─────────────────────────────────────────────
// HOST — broadcast helpers
// ─────────────────────────────────────────────
function broadcastAll(data){
    Object.values(connections).forEach(c=>{
        if(c.conn&&c.conn.open) try{c.conn.send(data);}catch(e){}
    });
}
function broadcastExcept(data,skip){
    Object.entries(connections).forEach(([id,c])=>{
        if(id===skip) return;
        if(c.conn&&c.conn.open) try{c.conn.send(data);}catch(e){}
    });
}

// ─────────────────────────────────────────────
// HOST — remove guest
// ─────────────────────────────────────────────
function removeGuest(gid){
    const name=participants[gid]?.name||'Someone';
    if(connections[gid]?.relays) Object.values(connections[gid].relays).forEach(r=>{try{r.close();}catch(e){}});
    cleanupAudioElement(gid);
    delete participants[gid];
    delete connections[gid];
    renderAll();
    broadcastAll({type:'left',id:gid,name});
    addSysMsg(`${name} left`);
}

// ─────────────────────────────────────────────
// Participant upsert
// ─────────────────────────────────────────────
function upsertParticipant(id,name,pic,stream,muted,hasVideo,isScreenSharing){
    if(!participants[id]) participants[id]={name,pic,stream,muted,hasVideo,isScreenSharing:isScreenSharing||false};
    else{
        if(name)          participants[id].name=name;
        if(pic)           participants[id].pic=pic;
        if(stream!==null) participants[id].stream=stream;
        participants[id].muted=muted;
        participants[id].hasVideo=hasVideo;
        if(isScreenSharing!==undefined) participants[id].isScreenSharing=isScreenSharing;
    }
    if(id!==myPeerId&&participants[id].stream) ensureAudioPlaying(participants[id].stream,id);
    renderAll();
}

// ─────────────────────────────────────────────
// GRID LAYOUT
// ─────────────────────────────────────────────
function applyGridLayout(grid,n){
    const isMobileW=window.innerWidth<=700;
    grid.style.gridTemplateAreas='';
    if(n===0) return;
    if(n===1){grid.style.gridTemplateColumns='1fr';grid.style.gridTemplateRows='1fr';return;}
    if(n===2){
        if(isMobileW){grid.style.gridTemplateColumns='1fr';grid.style.gridTemplateRows='1fr 1fr';}
        else{grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='1fr';}
        return;
    }
    if(n===3){
        if(isMobileW){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='3fr 2fr';grid.style.gridTemplateAreas='"a a" "b c"';}
        else{grid.style.gridTemplateColumns='13fr 7fr';grid.style.gridTemplateRows='1fr 1fr';grid.style.gridTemplateAreas='"a b" "a c"';}
        return;
    }
    if(n===4){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='1fr 1fr';return;}
    if(n===5){
        if(isMobileW){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='2fr 1fr 1fr';grid.style.gridTemplateAreas='"a a" "b c" "d e"';}
        else{grid.style.gridTemplateColumns='3fr 2fr 2fr';grid.style.gridTemplateRows='1fr 1fr';grid.style.gridTemplateAreas='"a b c" "a d e"';}
        return;
    }
    if(n===6){
        if(isMobileW){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows='1fr 1fr 1fr';}
        else{grid.style.gridTemplateColumns='1fr 1fr 1fr';grid.style.gridTemplateRows='1fr 1fr';}
        return;
    }
    if(n===7||n===8){
        if(isMobileW){grid.style.gridTemplateColumns='1fr 1fr';grid.style.gridTemplateRows=`repeat(${Math.ceil(n/2)},1fr)`;}
        else{
            grid.style.gridTemplateColumns='2fr 1fr 1fr';grid.style.gridTemplateRows='1fr 1fr 1fr';
            const others=['b','c','d','e','f','g','h'].slice(0,n-1);
            grid.style.gridTemplateAreas=`"a ${others.slice(0,2).join(' ')}" "a ${others.slice(2,4).join(' ')}" "a ${others.slice(4,6).join(' ')}"`;
        }
        return;
    }
    if(n<=9){grid.style.gridTemplateColumns='1fr 1fr 1fr';grid.style.gridTemplateRows='1fr 1fr 1fr';return;}
    if(n<=12){grid.style.gridTemplateColumns='1fr 1fr 1fr 1fr';grid.style.gridTemplateRows=`repeat(${Math.ceil(n/4)},1fr)`;return;}
    const cols=Math.ceil(Math.sqrt(n));
    grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    grid.style.gridTemplateRows=`repeat(${Math.ceil(n/cols)},1fr)`;
}

// ─────────────────────────────────────────────
// MIC TOGGLE
// ─────────────────────────────────────────────
function toggleMic(){
    micOn=!micOn;
    // Mute/unmute the actual mic track in localStream
    localStream.getAudioTracks().forEach(t=>{
        // Only mute our mic — not the screen audio track
        // Screen audio source is managed separately via AudioContext
        if(t._isMixedAudio) return; // skip mixed/screen tracks
        t.enabled=micOn;
    });
    // If we're using an AudioContext mixer, toggle the mic gain instead
    if(micSource && audioCtx){
        if(!micSource._gainNode){
            const g=audioCtx.createGain();
            micSource.connect(g);
            // reconnect to destination
            if(audioMixer) g.connect(audioMixer);
            micSource._gainNode=g;
            micSource.disconnect(audioMixer); // disconnect direct connection
        }
        micSource._gainNode.gain.value = micOn ? 1 : 0;
    }
    if(participants[myPeerId]) participants[myPeerId].muted=!micOn;
    renderAll(); updateCtrlBtns();
    toast(micOn?'Microphone ON':'Microphone OFF');
    const pkt={type:'mute-status',muted:!micOn};
    if(isHost) broadcastAll({...pkt,id:HOST_ID});
    else if(hostConn&&hostConn.open) hostConn.send(pkt);
}

    if(!hasVideoPermission){toast('Camera not available — close other apps using it and rejoin');return;}
    const vTracks=localStream?localStream.getVideoTracks():[];
    if(vTracks.length===0){toast('No camera track found — try rejoining');return;}
    camOn=!camOn;
    vTracks.forEach(t=>{t.enabled=camOn;});
    if(participants[myPeerId]){participants[myPeerId].hasVideo=camOn;participants[myPeerId].stream=localStream;}
    renderAll(); updateCtrlBtns();
    toast(camOn?'Camera ON':'Camera OFF');
    const pkt={type:'cam-status',hasVideo:camOn};
    if(isHost) broadcastAll({...pkt,id:HOST_ID});
    else if(hostConn&&hostConn.open) hostConn.send(pkt);
}

// ─────────────────────────────────────────────
// REPLACE TRACK IN ALL PEER CONNECTIONS
// ─────────────────────────────────────────────
function replaceTrackInPeers(newTrack, kind){
    if(!peer) return;
    Object.values(peer.connections).forEach(connArr=>{
        connArr.forEach(conn=>{
            if(conn.type==='media'&&conn.peerConnection){
                const senders=conn.peerConnection.getSenders();
                const sender=senders.find(s=>s.track&&s.track.kind===kind);
                if(sender&&newTrack){
                    sender.replaceTrack(newTrack).catch(e=>console.warn('replaceTrack err',e));
                }
            }
        });
    });
}

// ─────────────────────────────────────────────
// SCREEN SHARE  — completely rewritten for robustness + audio
// ─────────────────────────────────────────────

/*
 * SCREEN AUDIO STRATEGY
 * ─────────────────────
 * Chrome/Edge allow getDisplayMedia with audio:true and the user can tick
 * "Share tab audio" or "Share system audio". Safari/Firefox do NOT provide
 * a screen audio track. When we get a screen audio track we want to MERGE it
 * with the user's microphone so that both come out of the single audio track
 * in localStream (which is already wired into all the peer calls).
 *
 * We use the Web Audio API to create a mixer:
 *   [micTrack]    → MediaStreamSource → GainNode(mic)   ─┐
 *                                                          ├─→ Destination → mixedTrack
 *   [screenAudio] → MediaStreamSource → GainNode(screen)─┘
 *
 * The mixedTrack replaces the mic track in localStream via replaceTrack.
 * On stop we tear down the AudioContext and restore the original mic track.
 *
 * If getDisplayMedia returns no audio track we just replace the video track
 * as before and leave audio untouched.
 */

function createAudioMixer(micTrack, screenAudioTrack){
    // Create or resume AudioContext
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();

    audioMixer = audioCtx.createMediaStreamDestination();

    // Mic source
    const micStream = new MediaStream([micTrack]);
    micSource = audioCtx.createMediaStreamSource(micStream);
    const micGain = audioCtx.createGain();
    micGain.gain.value = micOn ? 1 : 0;
    micSource.connect(micGain);
    micGain.connect(audioMixer);
    micSource._gainNode = micGain;

    // Screen audio source
    if(screenAudioTrack){
        const screenAudioStream = new MediaStream([screenAudioTrack]);
        screenAudioSource = audioCtx.createMediaStreamSource(screenAudioStream);
        const screenGain = audioCtx.createGain();
        screenGain.gain.value = 1;
        screenAudioSource.connect(screenGain);
        screenGain.connect(audioMixer);
    }

    // The mixed output track
    mixedAudioTrack = audioMixer.stream.getAudioTracks()[0];
    mixedAudioTrack._isMixedAudio = true;
    return mixedAudioTrack;
}

function teardownAudioMixer(){
    try{ if(audioCtx) audioCtx.close(); }catch(e){}
    audioCtx = null;
    audioMixer = null;
    micSource = null;
    screenAudioSource = null;
    mixedAudioTrack = null;
}

async function toggleScreen(){
    if(!screenShareSupported){
        if(isIOS){
            toast('Screen sharing is not available on iOS — Apple restricts this in all browsers');
        } else {
            toast('Screen sharing is not supported in this browser');
        }
        return;
    }
    if(!screenOn){
        await startScreenShare();
    } else {
        await stopScreenShare();
    }
}

async function startScreenShare(){
    try{
        // Request screen + system audio if available
        screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: 'always', displaySurface: 'monitor' },
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                sampleRate: 44100,
                // Chrome: this signals we want system audio
                // Firefox/Safari will ignore and not provide audio track
            }
        });
    }catch(e){
        if(e.name!=='NotAllowedError') toast('Could not start screen share: '+e.message);
        screenStream = null;
        return;
    }

    screenOn = true;
    camWasOnBeforeScreen = camOn;

    const screenVideoTrack = screenStream.getVideoTracks()[0];
    const screenAudioTrack = screenStream.getAudioTracks()[0] || null; // may be null

    // ── Replace video track in localStream ──
    // Remove old video tracks
    localStream.getVideoTracks().forEach(t=>{
        localStream.removeTrack(t);
        t.stop();
    });
    localStream.addTrack(screenVideoTrack);

    // ── Handle audio: mix screen audio + mic ──
    const currentMicTrack = localStream.getAudioTracks().find(t=>!t._isMixedAudio);

    if(screenAudioTrack && currentMicTrack){
        // Mix mic + screen audio
        const mixed = createAudioMixer(currentMicTrack, screenAudioTrack);
        // Remove current mic track from localStream and add mixed track
        localStream.getAudioTracks().forEach(t=>localStream.removeTrack(t));
        localStream.addTrack(mixed);
        replaceTrackInPeers(mixed, 'audio');
    } else if(screenAudioTrack){
        // No mic — just use screen audio
        localStream.getAudioTracks().forEach(t=>localStream.removeTrack(t));
        localStream.addTrack(screenAudioTrack);
        replaceTrackInPeers(screenAudioTrack, 'audio');
    }
    // If no screenAudioTrack, leave audio untouched

    // Push new video to peers
    replaceTrackInPeers(screenVideoTrack, 'video');

    // Browser's native "Stop sharing" button
    screenVideoTrack.onended = ()=>{ if(screenOn) stopScreenShare(); };

    camOn = true;
    if(participants[myPeerId]){
        participants[myPeerId].hasVideo=true;
        participants[myPeerId].isScreenSharing=true;
        participants[myPeerId].stream=localStream;
    }
    renderAll(); updateCtrlBtns();

    if(screenAudioTrack){
        toast('Screen sharing ON — with audio');
    } else {
        toast('Screen sharing ON — no audio (check "Share audio" in the picker)');
    }
    broadcastScreenStatus(true);
}

async function stopScreenShare(){
    screenOn = false;

    // Stop all screen stream tracks
    if(screenStream){
        screenStream.getTracks().forEach(t=>t.stop());
        screenStream = null;
    }

    // Tear down audio mixer
    teardownAudioMixer();

    // Remove all current tracks from localStream
    localStream.getTracks().forEach(t=>localStream.removeTrack(t));

    // Re-acquire fresh camera + mic tracks
    let freshStream = null;
    try{
        freshStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: hasVideoPermission
        });
    }catch(e){
        // Try audio only
        try{
            freshStream = await navigator.mediaDevices.getUserMedia({audio:true});
        }catch(e2){
            console.warn('Could not restore media after screen share',e2);
        }
        camOn = false;
    }

    if(freshStream){
        freshStream.getTracks().forEach(t=>localStream.addTrack(t));
        // Restore states
        localStream.getAudioTracks().forEach(t=>{t.enabled=micOn;});
        localStream.getVideoTracks().forEach(t=>{t.enabled=camWasOnBeforeScreen;});
        camOn = camWasOnBeforeScreen;

        // Push fresh tracks to all peers
        const freshVid=localStream.getVideoTracks()[0];
        const freshAud=localStream.getAudioTracks()[0];
        if(freshVid) replaceTrackInPeers(freshVid,'video');
        if(freshAud) replaceTrackInPeers(freshAud,'audio');
    }

    if(participants[myPeerId]){
        participants[myPeerId].hasVideo=camOn;
        participants[myPeerId].isScreenSharing=false;
        participants[myPeerId].stream=localStream;
    }
    renderAll(); updateCtrlBtns();
    toast('Screen sharing OFF');
    broadcastScreenStatus(false);

    // Broadcast cam state too
    const pkt={type:'cam-status',hasVideo:camOn};
    if(isHost) broadcastAll({...pkt,id:HOST_ID});
    else if(hostConn&&hostConn.open) hostConn.send(pkt);
}

function broadcastScreenStatus(isSharing){
    const pkt={type:'screen-status',isScreenSharing:isSharing};
    if(isHost) broadcastAll({...pkt,id:HOST_ID});
    else if(hostConn&&hostConn.open) hostConn.send(pkt);
}

// ─────────────────────────────────────────────
// UPDATE TOGGLE VISUALS (using SVG icons, no emoji)
// ─────────────────────────────────────────────
function updateCtrlBtns(){
    const m=qs('micBtn'), c=qs('camBtn'), s=qs('screenBtn');

    // Mic
    m.className='toggle-pill '+(micOn?'state-on':'state-off');
    m.querySelector('.pill-text').textContent=micOn?'ON':'OFF';
    qs('micIcon').setAttribute('href', micOn?'#ic-mic':'#ic-mic-off');

    // Cam
    const camActive=camOn&&!screenOn;
    c.className='toggle-pill '+(camActive?'state-on':'state-off');
    c.querySelector('.pill-text').textContent=camActive?'ON':'OFF';
    qs('camIcon').setAttribute('href', camActive?'#ic-cam':'#ic-cam-off');

    // Screen
    if(!screenShareSupported){
        s.className='toggle-pill state-disabled';
        s.querySelector('.pill-text').textContent='N/A';
        qs('screenIcon').setAttribute('href','#ic-screen');
    } else if(screenOn){
        s.className='toggle-pill state-screen';
        s.querySelector('.pill-text').textContent='Stop';
        qs('screenIcon').setAttribute('href','#ic-screen-stop');
    } else {
        s.className='toggle-pill state-off';
        s.querySelector('.pill-text').textContent='Share';
        qs('screenIcon').setAttribute('href','#ic-screen');
    }
}

// ─────────────────────────────────────────────
// EXIT
// ─────────────────────────────────────────────
async function exitCall(){
    cancelTakeover(); stopHeartbeat();
    if(screenOn){
        screenOn=false;
        if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;}
        teardownAudioMixer();
    }
    if(isHost){
        db.collection('room').doc('main').set({onlineCount:0},{merge:true}).catch(()=>{});
        Object.values(connections).forEach(c=>{
            try{c.call?.close();}catch(e){}
            try{c.conn?.close();}catch(e){}
            if(c.relays) Object.values(c.relays).forEach(r=>{try{r.close();}catch(e){}});
        });
    }else{
        try{hostConn?.close();}catch(e){}
    }
    Object.keys(audioElements).forEach(cleanupAudioElement);
    if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
    try{peer?.destroy();}catch(e){}
    peer=null; hostConn=null;
    participants={}; connections={};
    isHost=false; myPeerId=''; micOn=true; camOn=false; hasVideoPermission=false;
    screenOn=false; screenStream=null;
    qs('chatMsgs').innerHTML='';
    qs('drawerChatMsgs').innerHTML='';
    qs('app').style.display='none';
    qs('authWrap').style.display='block';
    updateCtrlBtns();
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

qs('micBtn').onclick=toggleMic;
qs('camBtn').onclick=toggleCam;
qs('screenBtn').onclick=toggleScreen;
qs('endBtn').onclick=exitCall;

// ─────────────────────────────────────────────
// DESKTOP TABS
// ─────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab=>{
    tab.onclick=()=>{
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const which=tab.dataset.tab;
        qs('chatPanel').classList.toggle('active',which==='chat');
        qs('peoplePanel').classList.toggle('active',which==='people');

});

// ─────────────────────────────────────────────
// MOBILE DRAWER
// ─────────────────────────────────────────────
function openDrawer(){qs('mobileDrawer').classList.add('open');qs('drawerOverlay').classList.add('open');}
function closeDrawer(){qs('mobileDrawer').classList.remove('open');qs('drawerOverlay').classList.remove('open');}
qs('drawerToggleBtn').onclick=openDrawer;
qs('drawerClose').onclick=closeDrawer;
qs('drawerOverlay').onclick=closeDrawer;
document.querySelectorAll('.drawer-tab').forEach(tab=>{
    tab.onclick=()=>{
        document.querySelectorAll('.drawer-tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const which=tab.dataset.dtab;
        qs('drawerChatPanel').classList.toggle('active',which==='chat');
        qs('drawerPeoplePanel').classList.toggle('active',which==='people');
    };
});

// ─────────────────────────────────────────────
// FULLSCREEN
// ─────────────────────────────────────────────
qs('fullscreenBtn').onclick=()=>{
    const appEl=qs('app');
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
        const fn=appEl.requestFullscreen||appEl.webkitRequestFullscreen||appEl.mozRequestFullScreen;
        if(fn) fn.call(appEl).catch(e=>console.warn('Fullscreen err:',e));
    }else{
        const fn=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
        if(fn) fn.call(document).catch(e=>console.warn('Exit fullscreen err:',e));
    }
};
function onFsChange(){
    const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
    const icon=qs('fullscreenBtn').querySelector('use');
    icon.setAttribute('href',isFs?'#ic-fullscreen-exit':'#ic-fullscreen');
    qs('fullscreenBtn').title=isFs?'Exit Fullscreen':'Fullscreen';
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
</script>
